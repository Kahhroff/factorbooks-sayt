<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factor books — nashriyot</title>
<meta name="description" content="Factor books — 2021-yildan beri faoliyat yuritayotgan mustaqil nashriyot. Jahon adabiyotini asl nusxadan o'zbek tiliga tarjima qilamiz.">

<meta property="og:title" content="Factor books — nashriyot">
<meta property="og:description" content="Jahon adabiyoti. Asl nusxadan tarjima.">
<meta property="og:type" content="website">
<meta property="og:image" content="rasmlar/logo.png">

<link rel="icon" href="rasmlar/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   FACTOR BOOKS — sayt uslublari
   Ranglar logotipdan olingan.
   ============================================================ */

:root{
  --navy:      #000B5C;
  --blue:      #2A76D2;
  --blue-soft: #E8F0FB;
  --paper:     #F7F8FB;
  --ink:       #1A1D2E;
  --ink-soft:  #5C6178;
  --line:      #DDE1EC;
  --white:     #FFFFFF;
  --yashil:    #1C6B34;

  --serif: "Source Serif 4", Georgia, serif;
  --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --max: 1080px;
}

*,*::before,*::after{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

img{ max-width:100%; display:block; }
a{ color:inherit; }

:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:3px;
  border-radius:2px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
}

.ichki{ max-width:var(--max); margin:0 auto; padding:0 20px; }

/* ---------- YUQORI PANEL ---------- */

.shapka{
  background:var(--navy);
  color:var(--white);
  position:sticky; top:0; z-index:50;
}
.shapka .ichki{
  display:flex; align-items:center; justify-content:space-between;
  min-height:60px; gap:16px;
}
.logo{
  display:flex; align-items:center; gap:10px;
  text-decoration:none; color:var(--white);
  font-weight:600; font-size:17px; letter-spacing:.01em;
}
.logo img{ height:30px; width:auto; }

.shapka-ong{ display:flex; align-items:center; gap:10px; }

.menyu-tugma{
  background:none; border:1px solid rgba(255,255,255,.35);
  color:var(--white); border-radius:6px;
  width:40px; height:36px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; line-height:1;
}
.menyu-tugma:hover{ background:rgba(255,255,255,.1); }

.savat-tugma{
  background:rgba(255,255,255,.12);
  border:0; color:var(--white);
  border-radius:6px; height:36px; padding:0 13px;
  cursor:pointer; font-family:var(--sans); font-size:14px;
  display:flex; align-items:center; gap:7px;
  position:relative;
}
.savat-tugma:hover{ background:rgba(255,255,255,.22); }
.savat-soni{
  background:var(--blue); color:var(--white);
  border-radius:20px; min-width:20px; height:20px;
  font-size:12px; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  padding:0 5px;
}

.menyu{ display:none; }
.menyu a{
  color:rgba(255,255,255,.85);
  text-decoration:none; font-size:15px; padding:8px 2px;
}
.menyu a:hover{ color:var(--white); }
.menyu a.faol{ color:var(--white); border-bottom:2px solid var(--blue); }

.menyu.ochiq{
  display:flex; flex-direction:column; gap:4px;
  position:absolute; left:0; right:0; top:60px;
  background:var(--navy); padding:12px 20px 20px;
  border-top:1px solid rgba(255,255,255,.15);
}
.menyu.ochiq a{ padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08); }

@media (min-width:860px){
  .menyu-tugma{ display:none; }
  .menyu{ display:flex; gap:24px; align-items:center; }
  .menyu.ochiq{ position:static; flex-direction:row; padding:0; background:none; border:none; }
  .menyu.ochiq a{ border:none; padding:8px 2px; }
}

/* ---------- BOSH SAHIFA: HERO ---------- */

.hero{
  background:var(--white);
  border-bottom:1px solid var(--line);
  padding:56px 0 46px;
}
.hero h1{
  font-family:var(--serif);
  font-size:clamp(29px, 6vw, 46px);
  line-height:1.2;
  font-weight:600;
  margin:0 0 18px;
  max-width:17ch;
  color:var(--navy);
}
.hero p{
  margin:0; max-width:56ch;
  color:var(--ink-soft); font-size:17px;
}
.hero-raqam{
  display:flex; gap:34px; flex-wrap:wrap;
  margin-top:34px; padding-top:24px;
  border-top:1px solid var(--line);
}
.hero-raqam div span{
  display:block;
  font-family:var(--serif); font-size:27px; font-weight:600;
  color:var(--navy);
}
.hero-raqam div small{ color:var(--ink-soft); font-size:14px; }

/* ---------- BO'LIM SARLAVHASI ---------- */

.bolim{ padding:46px 0; }

.bolim-bosh{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:16px; margin-bottom:22px;
}
.bolim-bosh h2{
  font-family:var(--serif); font-size:25px; font-weight:600;
  margin:0; color:var(--navy);
}
.bolim-bosh a{ font-size:15px; color:var(--blue); text-decoration:none; white-space:nowrap; }
.bolim-bosh a:hover{ text-decoration:underline; }

/* ---------- E'LONLAR ---------- */

.elon-tur{ display:grid; gap:22px; }
@media (min-width:760px){
  .elon-tur{ grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); }
}

.elon{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  display:flex; flex-direction:column;
}
.elon-rasm{
  aspect-ratio:16/9;
  background:var(--blue-soft);
  overflow:hidden;
}
.elon-rasm img{ width:100%; height:100%; object-fit:cover; }

.elon-tana{ padding:20px; flex:1; display:flex; flex-direction:column; }

.elon-tur-belgi{
  display:inline-block; align-self:flex-start;
  font-size:11px; font-weight:600; letter-spacing:.03em;
  text-transform:uppercase;
  padding:4px 9px; border-radius:4px;
  background:var(--blue-soft); color:var(--navy);
  margin-bottom:11px;
}
.elon h3{
  font-family:var(--serif); font-size:20px; font-weight:600;
  margin:0 0 9px; line-height:1.3; color:var(--navy);
}
.elon .elon-matn{ margin:0; color:var(--ink-soft); font-size:15px; line-height:1.65; }
.elon .elon-matn p{ margin:0 0 10px; }
.elon .elon-sana{ margin-top:14px; font-size:13px; color:var(--ink-soft); }

/* ---------- SO'NGGI NASHRLAR LENTASI ---------- */

.lenta-oram{ position:relative; }

.lenta{
  display:flex; gap:18px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  padding-bottom:10px;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.lenta::-webkit-scrollbar{ display:none; }

.lenta > *{
  flex:0 0 auto;
  width:160px;
  scroll-snap-align:start;
}
@media (min-width:620px){ .lenta > *{ width:190px; } }

.lenta-tugma{
  display:none;
  position:absolute; top:38%;
  width:40px; height:40px; border-radius:50%;
  background:var(--white); border:1px solid var(--line);
  color:var(--navy); font-size:18px; cursor:pointer;
  align-items:center; justify-content:center;
  box-shadow:0 2px 8px rgba(0,11,92,.12);
  z-index:5;
}
.lenta-tugma:hover{ background:var(--blue-soft); }
.lenta-tugma.chap{ left:-18px; }
.lenta-tugma.ong{ right:-18px; }

@media (min-width:900px){
  .lenta-tugma{ display:flex; }
}

/* ---------- KITOB KARTASI ---------- */

.tur{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:24px 16px;
}
@media (min-width:620px){ .tur{ grid-template-columns:repeat(3,1fr); gap:28px 20px; } }
@media (min-width:900px){ .tur{ grid-template-columns:repeat(4,1fr); } }

.kitob{ text-decoration:none; color:inherit; display:block; }

.muqova{
  aspect-ratio:2/3;
  background:var(--blue-soft);
  border-radius:5px;
  overflow:hidden;
  position:relative;
  box-shadow:0 1px 4px rgba(0,11,92,.12);
}
.muqova img{ width:100%; height:100%; object-fit:cover; position:relative; z-index:2; }

/* Rasm bo'lmaganda ko'rinadigan matn.
   z-index:1 — rasm yuklansa uning ostida qoladi. */
.muqova-bosh{
  position:absolute; inset:0; z-index:1;
  display:flex; align-items:center; justify-content:center;
  padding:14px; text-align:center;
  font-family:var(--serif); font-size:14px; line-height:1.35;
  color:var(--navy);
}

.kitob h3{
  font-family:var(--serif); font-size:16px; font-weight:600;
  margin:11px 0 3px; line-height:1.3;
}
.kitob .muallif{ font-size:13px; color:var(--ink-soft); margin:0; }
.kitob .narx{ font-size:15px; margin:7px 0 0; font-weight:600; color:var(--navy); }

.nishon{
  display:inline-block;
  font-size:11px; font-weight:600; letter-spacing:.02em;
  padding:3px 7px; border-radius:3px;
  background:var(--blue); color:var(--white);
  position:absolute; top:8px; left:8px; z-index:3;
}
.nishon.kul{ background:var(--ink-soft); }

.karta-tugma{
  display:block; width:100%;
  margin-top:9px; padding:9px 10px;
  border:1px solid var(--line); border-radius:6px;
  background:var(--white); color:var(--navy);
  font-family:var(--sans); font-size:14px; font-weight:500;
  text-align:center; text-decoration:none; cursor:pointer;
}
.karta-tugma:hover{ background:var(--blue-soft); border-color:var(--blue); }

.karta-tugma.asosiy{
  background:var(--blue); color:var(--white); border-color:var(--blue);
}
.karta-tugma.asosiy:hover{ background:var(--navy); border-color:var(--navy); }

/* ---------- KATALOG FILTRLARI ---------- */

.filtr{
  display:flex; flex-wrap:wrap; gap:10px;
  margin-bottom:24px;
}
.filtr input, .filtr select{
  font-family:var(--sans); font-size:15px;
  padding:11px 12px;
  border:1px solid var(--line); border-radius:6px;
  background:var(--white); color:var(--ink);
  min-width:0;
}
.filtr input{ flex:1 1 200px; }
.filtr select{ flex:0 1 auto; }

.natija-soni{ font-size:14px; color:var(--ink-soft); margin:0 0 18px; }

/* ---------- KITOB SAHIFASI ---------- */

.kitob-sahifa{ display:grid; gap:28px; }
@media (min-width:760px){
  .kitob-sahifa{ grid-template-columns:300px 1fr; gap:46px; align-items:start; }
}
.kitob-sahifa h1{
  font-family:var(--serif); font-size:clamp(24px,4.5vw,33px);
  font-weight:600; margin:0 0 6px; color:var(--navy); line-height:1.25;
}
.kitob-sahifa .muallif-katta{ font-size:17px; color:var(--ink-soft); margin:0 0 22px; }

.narx-katta{
  font-family:var(--serif); font-size:29px; font-weight:600;
  color:var(--navy); margin:0 0 18px;
}

.sotib-blok{
  background:var(--white); border:1px solid var(--line);
  border-radius:9px; padding:18px; margin-bottom:24px;
}
.sotib-qator{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

.soni-boshqaruv{
  display:flex; align-items:center;
  border:1px solid var(--line); border-radius:6px;
  background:var(--white); overflow:hidden;
}
.soni-boshqaruv button{
  width:38px; height:42px; border:0; background:none;
  font-size:19px; color:var(--navy); cursor:pointer; font-family:var(--sans);
}
.soni-boshqaruv button:hover{ background:var(--blue-soft); }
.soni-boshqaruv span{
  min-width:42px; text-align:center; font-size:16px; font-weight:600;
}

.katta-tugma{
  flex:1 1 180px;
  padding:13px 22px; border:0; border-radius:6px;
  background:var(--blue); color:var(--white);
  font-family:var(--sans); font-size:15px; font-weight:600;
  cursor:pointer; text-align:center; text-decoration:none;
  display:inline-block;
}
.katta-tugma:hover{ background:var(--navy); }
.katta-tugma:disabled{ background:#9aa0b0; cursor:not-allowed; }

.katta-tugma.ikkilamchi{
  background:var(--white); color:var(--navy);
  border:1px solid var(--line);
}
.katta-tugma.ikkilamchi:hover{ background:var(--blue-soft); }

.tafsilot{
  width:100%; border-collapse:collapse;
  margin:24px 0; font-size:15px;
}
.tafsilot th, .tafsilot td{
  text-align:left; padding:9px 0;
  border-bottom:1px solid var(--line); vertical-align:top;
}
.tafsilot th{ font-weight:500; color:var(--ink-soft); width:42%; }

.tavsif-matn{ font-size:16px; line-height:1.72; max-width:68ch; }
.tavsif-matn p{ margin:0 0 14px; }

.orqaga{
  display:inline-block; margin-bottom:20px;
  font-size:15px; color:var(--blue); text-decoration:none;
}
.orqaga:hover{ text-decoration:underline; }

/* ---------- MATNLI SAHIFALAR ---------- */

.matn{ max-width:68ch; }
.matn h1{
  font-family:var(--serif); font-size:clamp(26px,5vw,35px);
  font-weight:600; color:var(--navy); margin:0 0 22px;
}
.matn h2{
  font-family:var(--serif); font-size:21px; font-weight:600;
  color:var(--navy); margin:34px 0 12px;
}
.matn p{ margin:0 0 16px; line-height:1.72; }

.jamoa{ list-style:none; padding:0; margin:0; }
.jamoa li{
  padding:12px 0; border-bottom:1px solid var(--line);
  display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.jamoa strong{ font-weight:500; }
.jamoa span{ color:var(--ink-soft); font-size:14px; }

.aloqa-royxat{ list-style:none; padding:0; margin:0; }
.aloqa-royxat li{ padding:14px 0; border-bottom:1px solid var(--line); }
.aloqa-royxat small{ display:block; color:var(--ink-soft); font-size:13px; margin-bottom:3px; }
.aloqa-royxat a{ color:var(--blue); text-decoration:none; font-size:17px; }
.aloqa-royxat a:hover{ text-decoration:underline; }

/* ---------- SAVAT ---------- */

.savat-parda{
  position:fixed; inset:0; z-index:100;
  background:rgba(10,14,40,.5);
  display:flex; justify-content:flex-end;
}

.savat-oyna{
  background:var(--paper);
  width:100%; max-width:440px;
  display:flex; flex-direction:column;
  height:100%;
}

.savat-bosh{
  background:var(--white);
  padding:16px 20px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
}
.savat-bosh h2{ font-family:var(--serif); font-size:20px; margin:0; color:var(--navy); }
.savat-bosh button{
  background:none; border:0; font-size:27px; line-height:1;
  color:var(--ink-soft); cursor:pointer; padding:0 4px;
}

.savat-tana{ flex:1; overflow-y:auto; padding:16px 20px; }

.savat-qator{
  display:flex; gap:13px;
  background:var(--white); border:1px solid var(--line);
  border-radius:8px; padding:12px; margin-bottom:11px;
}
.savat-qator img{
  width:52px; height:74px; object-fit:cover;
  border-radius:4px; background:var(--blue-soft); flex-shrink:0;
}
.savat-qator .ong{ flex:1; min-width:0; }
.savat-qator h4{
  font-family:var(--serif); font-size:15px; font-weight:600;
  margin:0 0 3px; line-height:1.3;
}
.savat-qator .narx-kichik{ font-size:13px; color:var(--ink-soft); margin:0 0 9px; }

.savat-qator .boshqaruv{ display:flex; align-items:center; gap:10px; }
.savat-qator .boshqaruv button{
  width:28px; height:28px; border:1px solid var(--line);
  border-radius:5px; background:var(--white);
  font-size:15px; color:var(--navy); cursor:pointer; line-height:1;
}
.savat-qator .boshqaruv button:hover{ background:var(--blue-soft); }
.savat-qator .boshqaruv span{ font-size:14px; font-weight:600; min-width:22px; text-align:center; }

.savat-ochir{
  background:none; border:0; color:var(--ink-soft);
  font-size:13px; cursor:pointer; margin-left:auto;
  text-decoration:underline; font-family:var(--sans);
  width:auto !important; height:auto !important;
}
.savat-ochir:hover{ color:#a32020; }

.savat-past{
  background:var(--white); border-top:1px solid var(--line);
  padding:16px 20px;
}
.savat-jami{
  display:flex; justify-content:space-between; align-items:baseline;
  margin-bottom:13px;
}
.savat-jami span{ color:var(--ink-soft); font-size:15px; }
.savat-jami strong{ font-family:var(--serif); font-size:22px; color:var(--navy); }

.savat-bosh-matn{
  text-align:center; padding:50px 20px; color:var(--ink-soft);
}

/* ---------- BUYURTMA FORMASI ---------- */

.forma{ max-width:560px; }

.forma-maydon{ margin-bottom:17px; }
.forma-maydon label{
  display:block; font-size:14px; font-weight:600;
  margin-bottom:6px; color:var(--ink);
}
.forma-maydon input, .forma-maydon textarea, .forma-maydon select{
  width:100%; padding:12px;
  border:1px solid var(--line); border-radius:6px;
  font-family:var(--sans); font-size:16px;
  background:var(--white); color:var(--ink);
}
.forma-maydon textarea{ resize:vertical; min-height:80px; }
.forma-maydon .izoh{ font-size:13px; color:var(--ink-soft); margin-top:5px; }

.tolov-royxat{ display:grid; gap:9px; }
.tolov-royxat label{
  display:flex; align-items:flex-start; gap:11px;
  padding:13px; border:1px solid var(--line); border-radius:7px;
  background:var(--white); cursor:pointer; font-weight:400;
  margin-bottom:0;
}
.tolov-royxat label:hover{ border-color:var(--blue); }
.tolov-royxat input{ width:auto; margin-top:3px; }
.tolov-royxat strong{ display:block; font-size:15px; font-weight:600; }
.tolov-royxat small{ color:var(--ink-soft); font-size:13px; }

.xulosa{
  background:var(--white); border:1px solid var(--line);
  border-radius:9px; padding:18px; margin-bottom:24px;
}
.xulosa-qator{
  display:flex; justify-content:space-between; gap:14px;
  padding:7px 0; font-size:15px;
}
.xulosa-qator.jami{
  border-top:1px solid var(--line); margin-top:9px; padding-top:13px;
  font-size:18px; font-weight:600; color:var(--navy);
}

.forma-xato{
  background:#fdecec; border:1px solid #f5b5b5; color:#a32020;
  padding:12px 14px; border-radius:7px; font-size:14px; margin-bottom:17px;
}

.rahmat{
  background:var(--white); border:1px solid var(--line);
  border-radius:10px; padding:38px 26px; text-align:center;
  max-width:520px; margin:20px auto;
}
.rahmat .belgi{
  width:56px; height:56px; border-radius:50%;
  background:#e3f5e8; color:var(--yashil);
  font-size:28px; display:flex; align-items:center; justify-content:center;
  margin:0 auto 18px;
}
.rahmat h1{
  font-family:var(--serif); font-size:26px; color:var(--navy);
  margin:0 0 12px; font-weight:600;
}
.rahmat p{ color:var(--ink-soft); margin:0 0 9px; }
.rahmat .raqam{
  font-family:var(--serif); font-size:21px; color:var(--navy);
  font-weight:600; margin:16px 0;
}

/* ---------- HOLAT XABARLARI ---------- */

.holat{ padding:54px 20px; text-align:center; color:var(--ink-soft); }
.holat strong{ display:block; color:var(--ink); margin-bottom:6px; font-weight:600; }

/* ---------- PASTKI XABAR ---------- */

.bildirish{
  position:fixed; left:50%; bottom:24px;
  transform:translateX(-50%);
  background:var(--yashil); color:var(--white);
  padding:12px 22px; border-radius:8px;
  font-size:14px; z-index:200;
  box-shadow:0 3px 14px rgba(0,0,0,.22);
  max-width:90%; text-align:center;
}

/* ---------- PASTKI PANEL ---------- */

.futer{
  background:var(--navy); color:rgba(255,255,255,.72);
  margin-top:56px; padding:40px 0 30px; font-size:14px;
}
.futer a{ color:rgba(255,255,255,.9); text-decoration:none; }
.futer a:hover{ text-decoration:underline; }
.futer-tur{ display:grid; gap:26px; margin-bottom:28px; }
@media (min-width:700px){ .futer-tur{ grid-template-columns:2fr 1fr 1fr; gap:40px; } }

</head>
<body>

          <li><a href="#/dokon">Do'kon</a></li>

        <ul id="futerAloqa"></ul>

<script>
/* ============================================================
   FACTOR BOOKS — sayt mantiqiy qismi
   ============================================================ */

/* ---------- SOZLAMALAR ----------
   Faqat shu blokni o'zgartirasiz.
   Aloqa ma'lumotlari bu yerda EMAS — ular Google Sheets'dagi
   "Sozlama" varag'idan olinadi va admin paneldan tahrirlanadi. */

var SOZLAMA = {
  api: "https://script.google.com/macros/s/AKfycbzqzes3O_B1kjZmBjG0aW-UeEtwTKiDh5z5g3JcOFCt-H7pyJI_fbsBh3ENjk2WOzKe/exec",

  muqovaPapka: "rasmlar/muqovalar/",
  elonPapka:   "rasmlar/elonlar/",

  boshSahifaSoni: 6,   // so'nggi nashrlar lentasida nechta kitob
  boshElonSoni:   3    // bosh sahifada nechta e'lon
};

/* ---------- MA'LUMOT ---------- */

var BAZA = { kitoblar:null, sozlama:{}, elonlar:[], xato:null };

function malumotniYukla(){
  if(BAZA.kitoblar){ return Promise.resolve(BAZA); }

  return fetch(SOZLAMA.api + "?nima=hammasi")
    .then(function(j){
      if(!j.ok){ throw new Error("Server javob bermadi (" + j.status + ")"); }
      return j.json();
    })
    .then(function(d){
      if(!d.ok){ throw new Error(d.xato || "Noma'lum xato"); }
      BAZA.kitoblar = d.kitoblar || [];
      BAZA.sozlama  = d.sozlama  || {};
      BAZA.elonlar  = d.elonlar  || [];
      futerniChiz();
      return BAZA;
    })
    .catch(function(e){
      BAZA.xato = e.message;
      throw e;
    });
}

/**
 * Sozlama varag'idan qiymat oladi.
 */
function soz(kalit, zaxira){
  var q = BAZA.sozlama[kalit];
  return (q === undefined || q === null || q === "") ? (zaxira || "") : q;
}

/* ---------- YORDAMCHI ---------- */

function xavfsiz(matn){
  return String(matn == null ? "" : matn)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function sonAjrat(son){
  return String(son).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function narxYoz(son){
  var n = parseInt(String(son).replace(/\D/g,""), 10);
  if(!n || isNaN(n)){ return ""; }
  return sonAjrat(n) + " so'm";
}

function narxSoni(qiymat){
  return parseInt(String(qiymat).replace(/\D/g,""), 10) || 0;
}

function bosh(matn){
  var s = String(matn || "");
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
}

function matnniBol(matn){
  if(!matn){ return ""; }
  return String(matn).split(/\n+/).filter(function(p){ return p.trim(); })
    .map(function(p){ return '<p>' + xavfsiz(p.trim()) + '</p>'; }).join("");
}

function kitobTop(id){
  if(!BAZA.kitoblar){ return null; }
  for(var i=0;i<BAZA.kitoblar.length;i++){
    if(BAZA.kitoblar[i].id === id){ return BAZA.kitoblar[i]; }
  }
  return null;
}

function bildirish(matn){
  var eski = document.querySelector(".bildirish");
  if(eski){ eski.remove(); }

  var blok = document.createElement("div");
  blok.className = "bildirish";
  blok.textContent = matn;
  document.body.appendChild(blok);

  setTimeout(function(){ blok.remove(); }, 2600);
}

/* ---------- SAVAT ----------
   Brauzer xotirasida saqlanadi. Faqat kitob id va soni;
   narx har safar bazadan olinadi. */

var SAVAT_KALIT = "mfb_savat";

function savatniOl(){
  try{
    var xom = localStorage.getItem(SAVAT_KALIT);
    var royxat = xom ? JSON.parse(xom) : [];
    return Array.isArray(royxat) ? royxat : [];
  }catch(e){ return []; }
}

function savatniSaqla(royxat){
  try{ localStorage.setItem(SAVAT_KALIT, JSON.stringify(royxat)); }catch(e){}
  savatSoniniYangila();
}

function savatgaQosh(kitobId, soni){
  var royxat = savatniOl();
  var topildi = false;

  for(var i=0;i<royxat.length;i++){
    if(royxat[i].id === kitobId){
      royxat[i].soni += soni;
      topildi = true;
      break;
    }
  }

  if(!topildi){ royxat.push({ id:kitobId, soni:soni }); }

  savatniSaqla(royxat);
}

function savatSoniniOzgartir(kitobId, farq){
  var royxat = savatniOl();

  for(var i=0;i<royxat.length;i++){
    if(royxat[i].id === kitobId){
      royxat[i].soni += farq;
      if(royxat[i].soni < 1){ royxat.splice(i,1); }
      break;
    }
  }

  savatniSaqla(royxat);
}

function savatdanOchir(kitobId){
  var royxat = savatniOl().filter(function(x){ return x.id !== kitobId; });
  savatniSaqla(royxat);
}

function savatniTozala(){
  savatniSaqla([]);
}

function savatJamiSoni(){
  var jami = 0;
  var royxat = savatniOl();
  for(var i=0;i<royxat.length;i++){ jami += royxat[i].soni; }
  return jami;
}

function savatSummasi(){
  var jami = 0;
  var royxat = savatniOl();

  for(var i=0;i<royxat.length;i++){
    var k = kitobTop(royxat[i].id);
    if(!k){ continue; }
    jami += narxSoni(k.narx_chakana) * royxat[i].soni;
  }

  return jami;
}

function savatSoniniYangila(){
  var soni = savatJamiSoni();
  var belgi = document.getElementById("savatSoni");
  if(!belgi){ return; }
  belgi.textContent = soni;
  belgi.style.display = soni > 0 ? "flex" : "none";
}

/* ---------- KITOB KARTASI ---------- */

function kartaHtml(k, dokonmi){
  var nishon = "";
  if(k.holat === "tez kunda"){ nishon = '<span class="nishon">Tez kunda</span>'; }
  if(k.holat === "tugagan"){   nishon = '<span class="nishon kul">Tugagan</span>'; }

  var sotuvdami = (k.holat === "sotuvda");
  var narx = sotuvdami ? narxYoz(k.narx_chakana) : "";

  var rasm = "";
  if(k.rasm){
    rasm = '<img src="' + SOZLAMA.muqovaPapka + xavfsiz(k.rasm) + '" alt="'
         + xavfsiz(k.nomi) + '" loading="lazy" onerror="this.remove()">';
  }

  // Do'konda — "Savatga", bosh sahifada — "Batafsil"
  var tugma = '<span class="karta-tugma">Batafsil</span>';
  if(dokonmi && sotuvdami){
    tugma = '<button class="karta-tugma asosiy" data-savat="' + xavfsiz(k.id) + '">Savatga</button>';
  }

  var narxHtml = "";
  if(narx){ narxHtml = '<p class="narx">' + narx + '</p>'; }

  return ''
  + '<div class="kitob-oram">'
  +   '<a class="kitob" href="#/kitob/' + xavfsiz(k.id) + '">'
  +     '<div class="muqova">'
  +       '<div class="muqova-bosh">' + xavfsiz(k.nomi) + '</div>'
  +       rasm
  +       nishon
  +     '</div>'
  +     '<h3>' + xavfsiz(k.nomi) + '</h3>'
  +     '<p class="muallif">' + xavfsiz(k.muallif) + '</p>'
  +     narxHtml
  +   '</a>'
  +   tugma
  + '</div>';
}

/* ---------- E'LON KARTASI ---------- */

function elonHtml(e){
  var rasm = "";
  if(e.rasm){
    rasm = '<div class="elon-rasm"><img src="' + SOZLAMA.elonPapka + xavfsiz(e.rasm)
         + '" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>';
  }

  var turNomi = String(e.turi || "").replace(/_/g," ");
  var turBelgi = "";
  if(turNomi){ turBelgi = '<span class="elon-tur-belgi">' + xavfsiz(turNomi) + '</span>'; }

  var matn = String(e.matn || "");
  if(matn.length > 260){ matn = matn.substring(0,260).trim() + "…"; }

  var sana = "";
  if(e.sana){ sana = '<div class="elon-sana">' + xavfsiz(e.sana) + '</div>'; }

  return ''
  + '<article class="elon">'
  +   rasm
  +   '<div class="elon-tana">'
  +     turBelgi
  +     '<h3>' + xavfsiz(e.sarlavha) + '</h3>'
  +     '<div class="elon-matn">' + matnniBol(matn) + '</div>'
  +     sana
  +   '</div>'
  + '</article>';
}

/* ============================================================
   SAHIFALAR
   ============================================================ */

/* ---------- 1. BOSH SAHIFA ---------- */

function sahifaBosh(){
  var kitoblar = BAZA.kitoblar;

  var yangi = kitoblar.slice().sort(function(a,b){
    return (parseInt(b.yil,10)||0) - (parseInt(a.yil,10)||0);
  }).slice(0, SOZLAMA.boshSahifaSoni);

  var elonlar = BAZA.elonlar.slice(0, SOZLAMA.boshElonSoni);

  var html = ''
  + '<section class="hero"><div class="ichki">'
  +   '<h1>Jahon adabiyoti, asl nusxadan tarjima qilingan</h1>'
  +   '<p>Factor books — 2021-yildan beri faoliyat yuritayotgan mustaqil nashriyot. '
  +   'Kitoblarni ingliz, turk, rus va arab tillaridan bevosita o\'zbek tiliga o\'giramiz, '
  +   'oraliq tilsiz. Muallif huquqlari rasmiy shartnoma asosida sotib olinadi.</p>'
  +   '<div class="hero-raqam">'
  +     '<div><span>40+</span><small>nashr etilgan kitob</small></div>'
  +     '<div><span>4</span><small>tarjima tili</small></div>'
  +     '<div><span>2021</span><small>tashkil topgan yil</small></div>'
  +   '</div>'
  + '</div></section>';

  html += ''
  + '<section class="bolim"><div class="ichki">'
  +   '<div class="bolim-bosh">'
  +     '<h2>So\'nggi nashrlar</h2>'
  +     '<a href="#/dokon">Barcha kitoblar</a>'
  +   '</div>'
  +   '<div class="lenta-oram">'
  +     '<button class="lenta-tugma chap" id="lentaChap" aria-label="Orqaga">‹</button>'
  +     '<div class="lenta" id="lenta">'
  +        yangi.map(function(k){ return kartaHtml(k, false); }).join("")
  +     '</div>'
  +     '<button class="lenta-tugma ong" id="lentaOng" aria-label="Oldinga">›</button>'
  +   '</div>'
  + '</div></section>';

  if(elonlar.length > 0){
    html += ''
    + '<section class="bolim" style="background:#FFFFFF;border-top:1px solid #DDE1EC;border-bottom:1px solid #DDE1EC">'
    +   '<div class="ichki">'
    +     '<div class="bolim-bosh"><h2>Yangiliklar</h2></div>'
    +     '<div class="elon-tur">' + elonlar.map(elonHtml).join("") + '</div>'
    +   '</div>'
    + '</section>';
  }

  html += ''
  + '<section class="bolim"><div class="ichki"><div class="matn">'
  +   '<h2 style="font-family:var(--serif);font-size:25px;color:var(--navy);margin:0 0 14px">Nashriyot haqida</h2>'
  +   '<p>Biz jahon adabiyotini o\'zbek kitobxoniga yetkazamiz — badiiy asarlar va '
  +     'non-fiction. Bizning ishimiz — matnni tez chiqarish emas, to\'g\'ri chiqarish.</p>'
  +   '<p><a href="#/haqida" style="color:var(--blue);text-decoration:none">Batafsil →</a></p>'
  + '</div></div></section>';

  return html;
}

function lentaniIshlat(){
  var lenta = document.getElementById("lenta");
  if(!lenta){ return; }

  var chap = document.getElementById("lentaChap");
  var ong  = document.getElementById("lentaOng");

  function sur(yonalish){
    lenta.scrollLeft += yonalish * lenta.clientWidth * 0.8;
  }

  if(chap){ chap.addEventListener("click", function(){ sur(-1); }); }
  if(ong){  ong.addEventListener("click",  function(){ sur(1); }); }
}

/* ---------- 2. DO'KON ---------- */

function sahifaDokon(){
  var kitoblar = BAZA.kitoblar;

  var janrlar = [], tillar = [];
  for(var i=0;i<kitoblar.length;i++){
    var k = kitoblar[i];
    if(k.janr    && janrlar.indexOf(k.janr) === -1){ janrlar.push(k.janr); }
    if(k.til_asl && tillar.indexOf(k.til_asl) === -1){ tillar.push(k.til_asl); }
  }
  janrlar.sort(); tillar.sort();

  var janrTanlov = janrlar.map(function(j){
    return '<option value="' + xavfsiz(j) + '">' + xavfsiz(bosh(j)) + '</option>';
  }).join("");

  var tilTanlov = tillar.map(function(t){
    return '<option value="' + xavfsiz(t) + '">' + xavfsiz(bosh(t)) + ' tilidan</option>';
  }).join("");

  return ''
  + '<section class="bolim"><div class="ichki">'
  +   '<div class="bolim-bosh"><h2>Do\'kon</h2></div>'
  +   '<div class="filtr">'
  +     '<input type="search" id="qidiruv" placeholder="Kitob yoki muallif nomi" aria-label="Qidiruv">'
  +     '<select id="fJanr" aria-label="Janr"><option value="">Barcha janrlar</option>'
  +        janrTanlov
  +     '</select>'
  +     '<select id="fTil" aria-label="Til"><option value="">Barcha tillar</option>'
  +        tilTanlov
  +     '</select>'
  +   '</div>'
  +   '<p class="natija-soni" id="natijaSoni"></p>'
  +   '<div class="tur" id="katalogTur"></div>'
  + '</div></section>';
}

function dokonniIshlat(){
  var kitoblar = BAZA.kitoblar;

  var qidiruv = document.getElementById("qidiruv");
  var fJanr   = document.getElementById("fJanr");
  var fTil    = document.getElementById("fTil");
  var tur     = document.getElementById("katalogTur");
  var soni    = document.getElementById("natijaSoni");
  if(!tur){ return; }

  function chiz(){
    var q = (qidiruv.value || "").toLowerCase().trim();
    var j = fJanr.value;
    var t = fTil.value;

    var royxat = kitoblar.filter(function(k){
      if(j && k.janr !== j){ return false; }
      if(t && k.til_asl !== t){ return false; }
      if(q){
        var matn = (k.nomi + " " + k.muallif + " " + k.tarjimon).toLowerCase();
        if(matn.indexOf(q) === -1){ return false; }
      }
      return true;
    });

    if(royxat.length === 0){
      tur.innerHTML = '';
      soni.textContent = 'Bu shartlarga mos kitob topilmadi.';
      return;
    }

    soni.textContent = royxat.length + " ta kitob";
    tur.innerHTML = royxat.map(function(k){ return kartaHtml(k, true); }).join("");
  }

  qidiruv.addEventListener("input", chiz);
  fJanr.addEventListener("change", chiz);
  fTil.addEventListener("change", chiz);
  chiz();
}

/* ---------- 3. KITOB SAHIFASI ---------- */

function sahifaKitob(id){
  var k = kitobTop(id);

  if(!k){
    return '<div class="holat"><strong>Kitob topilmadi</strong>'
         + 'Bu havola eskirgan bo\'lishi mumkin. '
         + '<a href="#/dokon" style="color:var(--blue)">Do\'konga o\'tish</a></div>';
  }

  var tavsif = '<p style="color:var(--ink-soft)">Bu kitob haqida tavsif tez orada qo\'shiladi.</p>';
  if(k.tavsif){ tavsif = matnniBol(k.tavsif); }

  var qatorlar = [];
  function qator(nom, qiymat){
    if(qiymat){ qatorlar.push('<tr><th>' + nom + '</th><td>' + xavfsiz(qiymat) + '</td></tr>'); }
  }
  qator("Muallif",        k.muallif);
  qator("Tarjimon",       k.tarjimon);
  qator("Asl tili",       bosh(k.til_asl));
  qator("Janr",           bosh(k.janr_tafsil || k.janr));
  qator("Sahifalar soni", k.sahifa);
  qator("Nashr yili",     k.yil);
  qator("Muqova",         bosh(k.muqova));
  qator("ISBN",           k.isbn);

  // Sotib olish bloki
  var sotibBlok;

  if(k.holat === "sotuvda"){
    sotibBlok = ''
    + '<p class="narx-katta">' + narxYoz(k.narx_chakana) + '</p>'
    + '<div class="sotib-blok">'
    +   '<div class="sotib-qator">'
    +     '<div class="soni-boshqaruv">'
    +       '<button id="soniKam" aria-label="Kamaytirish">−</button>'
    +       '<span id="soniQiymat">1</span>'
    +       '<button id="soniKop" aria-label="Ko\'paytirish">+</button>'
    +     '</div>'
    +     '<button class="katta-tugma" id="savatgaTugma" data-id="' + xavfsiz(k.id) + '">Savatga qo\'shish</button>'
    +   '</div>'
    + '</div>';
  } else if(k.holat === "tez kunda"){
    sotibBlok = '<div class="sotib-blok"><p style="margin:0;color:var(--blue);font-weight:500">'
              + 'Bu kitob tez kunda sotuvga chiqadi.</p></div>';
  } else {
    sotibBlok = '<div class="sotib-blok"><p style="margin:0;color:var(--ink-soft)">'
              + 'Hozircha sotuvda yo\'q.</p></div>';
  }

  var rasm = "";
  if(k.rasm){
    rasm = '<img src="' + SOZLAMA.muqovaPapka + xavfsiz(k.rasm) + '" alt="'
         + xavfsiz(k.nomi) + '" onerror="this.remove()">';
  }

  return ''
  + '<section class="bolim"><div class="ichki">'
  +   '<a class="orqaga" href="#/dokon">← Do\'konga qaytish</a>'
  +   '<div class="kitob-sahifa">'
  +     '<div class="muqova">'
  +       '<div class="muqova-bosh">' + xavfsiz(k.nomi) + '</div>'
  +       rasm
  +     '</div>'
  +     '<div>'
  +       '<h1>' + xavfsiz(k.nomi) + '</h1>'
  +       '<p class="muallif-katta">' + xavfsiz(k.muallif) + '</p>'
  +       sotibBlok
  +       '<div class="tavsif-matn">' + tavsif + '</div>'
  +       '<table class="tafsilot">' + qatorlar.join("") + '</table>'
  +     '</div>'
  +   '</div>'
  + '</div></section>';
}

function kitobSahifasiniIshlat(){
  var kam = document.getElementById("soniKam");
  if(!kam){ return; }

  var kop    = document.getElementById("soniKop");
  var qiymat = document.getElementById("soniQiymat");
  var tugma  = document.getElementById("savatgaTugma");

  var soni = 1;

  kam.addEventListener("click", function(){
    if(soni > 1){ soni--; qiymat.textContent = soni; }
  });

  kop.addEventListener("click", function(){
    if(soni < 50){ soni++; qiymat.textContent = soni; }
  });

  tugma.addEventListener("click", function(){
    savatgaQosh(this.getAttribute("data-id"), soni);
    bildirish(soni + " nusxa savatga qo'shildi");
  });
}

/* ---------- 4. BUYURTMA ---------- */

function sahifaBuyurtma(){
  var savat = savatniOl();

  if(savat.length === 0){
    return '<div class="holat"><strong>Savat bo\'sh</strong>'
         + 'Buyurtma berish uchun avval kitob tanlang. '
         + '<a href="#/dokon" style="color:var(--blue)">Do\'konga o\'tish</a></div>';
  }

  var qatorlar = [];
  var summa = 0;

  for(var i=0;i<savat.length;i++){
    var k = kitobTop(savat[i].id);
    if(!k){ continue; }

    var qiymat = narxSoni(k.narx_chakana) * savat[i].soni;
    summa += qiymat;

    qatorlar.push(
      '<div class="xulosa-qator">'
      + '<span>' + xavfsiz(k.nomi) + ' × ' + savat[i].soni + '</span>'
      + '<span>' + sonAjrat(qiymat) + '</span>'
      + '</div>'
    );
  }

  // To'lov turlari. Bank o'tkazmasi faqat hisob raqam kiritilgan bo'lsa.
  var tolovlar = ''
  + '<label><input type="radio" name="tolov" value="naqd" checked>'
  +   '<span><strong>Naqd</strong><small>Kuryerga topshirasiz</small></span></label>'
  + '<label><input type="radio" name="tolov" value="karta">'
  +   '<span><strong>Karta orqali</strong><small>Buyurtma tasdiqlangach karta raqami yuboriladi</small></span></label>'
  + '<label><input type="radio" name="tolov" value="click">'
  +   '<span><strong>Click yoki Payme</strong><small>To\'lov havolasi yuboriladi</small></span></label>';

  if(soz("hisob_raqam")){
    tolovlar += '<label><input type="radio" name="tolov" value="hisob_raqam">'
              + '<span><strong>Bank o\'tkazmasi</strong><small>Tashkilotlar uchun</small></span></label>';

  return ''
  + '<section class="bolim"><div class="ichki">'
  +   '<a class="orqaga" href="#/dokon">← Do\'konga qaytish</a>'
  +   '<div class="matn"><h1>Buyurtma berish</h1></div>'

  +   '<div class="xulosa" style="max-width:560px">'
  +     qatorlar.join("")
  +     '<div class="xulosa-qator jami">'
  +       '<span>Jami</span><span>' + sonAjrat(summa) + ' so\'m</span>'
  +     '</div>'
  +   '</div>'

  +   '<div class="forma">'
  +     '<div id="formaXato" class="forma-xato" style="display:none"></div>'

  +     '<div class="forma-maydon">'
  +       '<label for="bIsm">Ismingiz *</label>'
  +       '<input type="text" id="bIsm" autocomplete="name">'
  +     '</div>'

  +     '<div class="forma-maydon">'
  +       '<label for="bTelefon">Telefon raqamingiz *</label>'
  +       '<input type="tel" id="bTelefon" placeholder="90 123 45 67" autocomplete="tel">'
  +       '<div class="izoh">Buyurtmani tasdiqlash uchun qo\'ng\'iroq qilamiz.</div>'
  +     '</div>'

  +     '<div class="forma-maydon">'
  +       '<label for="bManzil">Yetkazib berish manzili</label>'
  +       '<textarea id="bManzil" placeholder="Shahar, tuman, ko\'cha, uy"></textarea>'
  +     '</div>'

  +     '<div class="forma-maydon">'
  +       '<label for="bPromokod">Promokod</label>'
  +       '<input type="text" id="bPromokod" placeholder="Bo\'lsa kiriting">'
  +     '</div>'

  +     '<div class="forma-maydon">'
  +       '<label>To\'lov turi</label>'

  +     '</div>'

  +       '<label for="bIzoh">Qo\'shimcha izoh</label>'

  +     '</div>'

  +     '<button class="katta-tugma" id="buyurtmaYubor" style="width:100%">Buyurtmani yuborish</button>'
  +   '</div>'
  + '</div></section>';
}

function buyurtmaniIshlat(){
  var tugma = document.getElementById("buyurtmaYubor");
  if(!tugma){ return; }

  tugma.addEventListener("click", function(){
    var xatoBlok = document.getElementById("formaXato");
    xatoBlok.style.display = "none";

    var ism = document.getElementById("bIsm").value.trim();
    if(ism.length < 2){
      xatoniKorsat(xatoBlok, "Ismingizni kiriting.");
      return;
    }

    var telefon = document.getElementById("bTelefon").value.trim();
    var faqatRaqam = telefon.replace(/\D/g,"");
    if(faqatRaqam.length !== 9 && faqatRaqam.length !== 12){
      xatoniKorsat(xatoBlok, "Telefon raqamini to'g'ri kiriting. Masalan: 90 123 45 67");
      return;
    }

    var tolovTugma = document.querySelector('input[name="tolov"]:checked');

    var savatQatorlari = savatniOl().map(function(x){
      return { kitob_id: x.id, soni: x.soni };
    });

    var malumot = {
      amal: "buyurtma",
      ism: ism,
      telefon: telefon,
      manzil: document.getElementById("bManzil").value.trim(),
      promokod: document.getElementById("bPromokod").value.trim(),
      tolov_turi: tolovTugma ? tolovTugma.value : "naqd",
      izoh: document.getElementById("bIzoh").value.trim(),
      qatorlar: savatQatorlari
    };

    tugma.disabled = true;
    tugma.textContent = "Yuborilmoqda...";

    // Apps Script preflight so'rovga javob bermaydi,
    // shuning uchun Content-Type ataylab "text/plain"
    fetch(SOZLAMA.api, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(malumot)
    })
    .then(function(j){ return j.json(); })
    .then(function(natija){
      tugma.disabled = false;
      tugma.textContent = "Buyurtmani yuborish";

      if(!natija.ok){
        xatoniKorsat(xatoBlok, natija.xato || "Buyurtma yuborilmadi.");
        return;
      }

      savatniTozala();
      OXIRGI_BUYURTMA = natija;
      location.hash = "#/rahmat";
    })
    .catch(function(e){
      tugma.disabled = false;
      tugma.textContent = "Buyurtmani yuborish";
      xatoniKorsat(xatoBlok, "Ulanishda xato: " + e.message);
    });
  });
}

function xatoniKorsat(blok, matn){
  blok.textContent = matn;
  blok.style.display = "block";
  blok.scrollIntoView({ behavior:"smooth", block:"center" });
}

/* ---------- 8. ALOQA ---------- */

function sahifaAloqa(){
  var qatorlar = [];

  function aloqaQator(nom, qiymat, havola){
    if(!qiymat){ return; }

    var ichi;
    if(havola){
      ichi = '<a href="' + havola + '" target="_blank" rel="noopener">'
           + xavfsiz(qiymat) + '</a>';
    }else{
      ichi = '<span style="font-size:17px">' + xavfsiz(qiymat) + '</span>';
    }

    qatorlar.push('<li><small>' + nom + '</small>' + ichi + '</li>');
  }

  var tel1 = soz("telefon_1");
  var tel2 = soz("telefon_2");
  var email = soz("email");
  var telegram = soz("telegram");
  var instagram = soz("instagram");
  var manzil = soz("manzil");
  var ishVaqti = soz("ish_vaqti");

  if(tel1){ aloqaQator("Telefon", tel1, "tel:" + tel1.replace(/\s/g,"")); }
  if(tel2){ aloqaQator("Telefon", tel2, "tel:" + tel2.replace(/\s/g,"")); }
  if(telegram){ aloqaQator("Telegram", "yozish", telegram); }
  if(instagram){ aloqaQator("Instagram", "sahifaga o'tish", instagram); }
  if(email){ aloqaQator("Elektron pochta", email, "mailto:" + email); }

  if(manzil){
    qatorlar.push('<li><small>Manzil</small><span style="font-size:17px">'
      + xavfsiz(manzil).replace(/\n/g,"<br>") + '</span></li>');
  }
  if(ishVaqti){ aloqaQator("Ish vaqti", ishVaqti); }

  var yetkazish = soz("yetkazish_matn");
  var yetkazishBlok = "";
  if(yetkazish){
    yetkazishBlok = '<h2>Yetkazib berish</h2>' + matnniBol(yetkazish);
  }

  return ''
  + '<section class="bolim"><div class="ichki"><div class="matn">'
  +   '<h1>Aloqa</h1>'
  +   '<ul class="aloqa-royxat">' + qatorlar.join("") + '</ul>'
  +   yetkazishBlok
  + '</div></div></section>';
}

/* ============================================================
   SAVAT OYNASI
   ============================================================ */

function savatniOch(){
  var savat = savatniOl();
  var ichi;

  if(savat.length === 0){
    ichi = '<div class="savat-bosh-matn">Savat bo\'sh</div>';
  }else{
    var qatorlar = [];

    for(var i=0;i<savat.length;i++){
      var k = kitobTop(savat[i].id);
      if(!k){ continue; }

      var rasm = '<img alt="" style="visibility:hidden">';
      if(k.rasm){
        rasm = '<img src="' + SOZLAMA.muqovaPapka + xavfsiz(k.rasm)
             + '" alt="" onerror="this.style.visibility=\'hidden\'">';
      }

      qatorlar.push(''
      + '<div class="savat-qator">'
      +   rasm
      +   '<div class="ong">'
      +     '<h4>' + xavfsiz(k.nomi) + '</h4>'
      +     '<p class="narx-kichik">' + sonAjrat(narxSoni(k.narx_chakana)) + ' so\'m</p>'
      +     '<div class="boshqaruv">'
      +       '<button data-kam="' + xavfsiz(k.id) + '">−</button>'
      +       '<span>' + savat[i].soni + '</span>'
      +       '<button data-kop="' + xavfsiz(k.id) + '">+</button>'
      +       '<button class="savat-ochir" data-ochir="' + xavfsiz(k.id) + '">o\'chirish</button>'
      +     '</div>'
      +   '</div>'
      + '</div>');
    }

    ichi = qatorlar.join("");
  }

  var pastBlok = "";
  if(savat.length > 0){
    pastBlok = ''
    + '<div class="savat-past">'
    +   '<div class="savat-jami"><span>Jami</span><strong>'
    +     sonAjrat(savatSummasi()) + ' so\'m</strong></div>'
    +   '<button class="katta-tugma" id="buyurtmagaOtish" style="width:100%">Buyurtma berish</button>'
    + '</div>';
  }

  var parda = document.createElement("div");
  parda.className = "savat-parda";
  parda.id = "savatParda";

  parda.innerHTML = ''
  + '<div class="savat-oyna">'
  +   '<div class="savat-bosh">'
  +     '<h2>Savat</h2>'
  +     '<button id="savatYopish" aria-label="Yopish">&times;</button>'
  +   '</div>'
  +   '<div class="savat-tana">' + ichi + '</div>'
  +   pastBlok
  + '</div>';

  document.body.appendChild(parda);
  document.body.style.overflow = "hidden";

  function yop(){
    parda.remove();
    document.body.style.overflow = "";
  }

  document.getElementById("savatYopish").addEventListener("click", yop);
  parda.addEventListener("click", function(h){ if(h.target === parda){ yop(); } });

  // Soni boshqaruvi — oyna qayta chiziladi
  parda.addEventListener("click", function(h){
    if(!h.target.getAttribute){ return; }

    var kam   = h.target.getAttribute("data-kam");
    var kop   = h.target.getAttribute("data-kop");
    var ochir = h.target.getAttribute("data-ochir");

    if(kam){   savatSoniniOzgartir(kam, -1); yop(); savatniOch(); }
    if(kop){   savatSoniniOzgartir(kop, 1);  yop(); savatniOch(); }
    if(ochir){ savatdanOchir(ochir);         yop(); savatniOch(); }
  });

  var otish = document.getElementById("buyurtmagaOtish");
  if(otish){
    otish.addEventListener("click", function(){
      yop();
      location.hash = "#/buyurtma";
    });
  }
}

function futerniChiz(){
  var royxat = document.getElementById("futerAloqa");
  var past = document.getElementById("futerPast");
  if(!royxat || !past){ return; }

  var qatorlar = [];

  var tel1 = soz("telefon_1");
  var telegram = soz("telegram");
  var instagram = soz("instagram");

  if(tel1){
    qatorlar.push('<li><a href="tel:' + tel1.replace(/\s/g,"") + '">'
      + xavfsiz(tel1) + '</a></li>');
  }
  if(telegram){
    qatorlar.push('<li><a href="' + xavfsiz(telegram)
      + '" target="_blank" rel="noopener">Telegram</a></li>');
  }
  if(instagram){
    qatorlar.push('<li><a href="' + xavfsiz(instagram)
      + '" target="_blank" rel="noopener">Instagram</a></li>');
  }

  royxat.innerHTML = qatorlar.join("");

  var bolaklar = [];
  var yuridik = soz("yuridik_nomi");
  var manzil = soz("manzil");

  if(yuridik){ bolaklar.push(xavfsiz(yuridik)); }
  if(manzil){ bolaklar.push(xavfsiz(manzil.replace(/\n/g, ", "))); }
  bolaklar.push(new Date().getFullYear());

  past.innerHTML = bolaklar.join(" · ");
}

/* ============================================================
   YO'NALTIRUVCHI (ROUTER)
   ============================================================ */

var ekran = document.getElementById("ekran");

function yuklanmoqdaKorsat(){
  ekran.innerHTML = '<div class="holat"><strong>Yuklanmoqda</strong>Bir lahza kuting…</div>';
}

function xatoKorsat(xabar){
  ekran.innerHTML = '<div class="holat"><strong>Ma\'lumot yuklanmadi</strong>'
    + xavfsiz(xabar) + '<br><br>'
    + '<a href="javascript:location.reload()" style="color:var(--blue)">Qayta urinish</a></div>';
}

function yonaltir(){
  var yol = (location.hash || "#/").replace(/^#/, "");
  var qism = yol.split("/").filter(Boolean);

  var havolalar = document.querySelectorAll("#menyu a");
  for(var i=0;i<havolalar.length;i++){
    var h = havolalar[i].getAttribute("href").replace(/^#/,"");
    havolalar[i].classList.toggle("faol", h === yol);
  }

  document.getElementById("menyu").classList.remove("ochiq");
  document.getElementById("menyuTugma").setAttribute("aria-expanded","false");

  window.scrollTo(0,0);

  var bolim = qism[0] || "";

  // Ma'lumot kerak bo'lmaydigan sahifa
  if(bolim === "haqida"){
    ekran.innerHTML = sahifaHaqida();
    return;
  }

  yuklanmoqdaKorsat();

  malumotniYukla().then(function(){
    if(bolim === "dokon"){
      ekran.innerHTML = sahifaDokon();
      dokonniIshlat();
    } else if(bolim === "kitob"){
      ekran.innerHTML = sahifaKitob(qism[1] || "");
      kitobSahifasiniIshlat();
    } else if(bolim === "buyurtma"){
      ekran.innerHTML = sahifaBuyurtma();
      buyurtmaniIshlat();
    } else if(bolim === "rahmat"){
      ekran.innerHTML = sahifaRahmat();
    } else if(bolim === "aloqa"){
      ekran.innerHTML = sahifaAloqa();
    } else if(bolim === "ulgurji"){
      ekran.innerHTML = sahifaUlgurji();
    } else {
      ekran.innerHTML = sahifaBosh();
      lentaniIshlat();
    }

    savatSoniniYangila();
  }).catch(function(e){
    xatoKorsat(e.message);
  });
}

/* ============================================================
   ISHGA TUSHIRISH
   ============================================================ */

window.addEventListener("hashchange", yonaltir);

document.getElementById("menyuTugma").addEventListener("click", function(){
  var m = document.getElementById("menyu");
  var ochiq = m.classList.toggle("ochiq");
  this.setAttribute("aria-expanded", ochiq ? "true" : "false");
});

document.getElementById("savatTugma").addEventListener("click", savatniOch);

// Do'kondagi "Savatga" tugmalari
document.addEventListener("click", function(h){
  if(!h.target.getAttribute){ return; }

  var id = h.target.getAttribute("data-savat");
  if(!id){ return; }

  h.preventDefault();
  savatgaQosh(id, 1);
  bildirish("Savatga qo'shildi");
});

savatSoniniYangila();
yonaltir();
</script>
