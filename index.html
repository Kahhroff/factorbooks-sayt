<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factor books — nashriyot</title>
<meta name="description" content="Factor books — 2021-yildan beri faoliyat yuritayotgan mustaqil nashriyot. Jahon adabiyotini asl nusxadan o'zbek tiliga tarjima qilamiz.">

<meta property="og:title" content="Factor books — nashriyot">
<meta property="og:description" content="Jahon adabiyoti. Asl nusxadan tarjima.">
<meta property="og:type" content="website">
<meta property="og:image" content="rasmlar/logo.png">

<link rel="icon" href="rasmlar/favicon.png">
<link rel="apple-touch-icon" href="rasmlar/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   FACTOR BOOKS — sayt uslublari
   Ranglar logotipdan olingan.
   ============================================================ */

:root{
  --navy:      #000B5C;
  --blue:      #2A76D2;
  --blue-soft: #E8F0FB;
  --paper:     #F7F8FB;
  --ink:       #1A1D2E;
  --ink-soft:  #5C6178;
  --line:      #DDE1EC;
  --white:     #FFFFFF;
  --yashil:    #1C6B34;

  --serif: "Source Serif 4", Georgia, serif;
  --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --max: 1120px;
}

*,*::before,*::after{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

img{ max-width:100%; display:block; }
a{ color:inherit; }

:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:3px;
  border-radius:2px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
}

.ichki{ max-width:var(--max); margin:0 auto; padding:0 20px; }

/* ---------- YUQORI PANEL ---------- */

.shapka{
  background:var(--navy);
  color:var(--white);
  position:sticky; top:0; z-index:50;
}
.shapka .ichki{
  display:flex; align-items:center; justify-content:space-between;
  min-height:64px; gap:16px;
}
.logo{
  display:flex; align-items:center; gap:11px;
  text-decoration:none; color:var(--white);
  font-weight:600; font-size:17px; letter-spacing:.01em;
  flex-shrink:0;
}
/* Logotip to'q ko'k fonda — oq doira ichida turadi */
.logo img{
  height:38px; width:38px;
  object-fit:contain;
  background:var(--white);
  border-radius:8px;
  padding:3px;
}

.shapka-ong{ display:flex; align-items:center; gap:10px; }

.menyu-tugma{
  background:none; border:1px solid rgba(255,255,255,.35);
  color:var(--white); border-radius:6px;
  width:40px; height:36px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; line-height:1;
}
.menyu-tugma:hover{ background:rgba(255,255,255,.1); }

.savat-tugma{
  background:rgba(255,255,255,.12);
  border:0; color:var(--white);
  border-radius:6px; height:36px; padding:0 13px;
  cursor:pointer; font-family:var(--sans); font-size:14px;
  display:flex; align-items:center; gap:7px;
}
.savat-tugma:hover{ background:rgba(255,255,255,.22); }
.savat-soni{
  background:var(--blue); color:var(--white);
  border-radius:20px; min-width:20px; height:20px;
  font-size:12px; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  padding:0 5px;
}

.menyu{ display:none; }
.menyu a{
  color:rgba(255,255,255,.85);
  text-decoration:none; font-size:15px; padding:8px 2px;
}
.menyu a:hover{ color:var(--white); }
.menyu a.faol{ color:var(--white); border-bottom:2px solid var(--blue); }

.menyu.ochiq{
  display:flex; flex-direction:column; gap:4px;
  position:absolute; left:0; right:0; top:64px;
  background:var(--navy); padding:12px 20px 20px;
  border-top:1px solid rgba(255,255,255,.15);
}
.menyu.ochiq a{ padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08); }

@media (min-width:900px){
  .menyu-tugma{ display:none; }
  .menyu{ display:flex; gap:24px; align-items:center; }
  .menyu.ochiq{ position:static; flex-direction:row; padding:0; background:none; border:none; }
  .menyu.ochiq a{ border:none; padding:8px 2px; }
}

/* ---------- BANNER (bosh sahifa tepasi) ---------- */

.banner-bolim{ padding:24px 0 0; }

.banner{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  background:var(--blue-soft);
  min-height:300px;
  display:flex; align-items:center;
}

.banner-rasm{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  z-index:1;
}

/* Matn o'qilishi uchun rasm ustida ochiq qatlam */
.banner-parda{
  position:absolute; inset:0; z-index:2;
  background:linear-gradient(90deg,
    rgba(255,255,255,.96) 0%,
    rgba(255,255,255,.90) 42%,
    rgba(255,255,255,.35) 68%,
    rgba(255,255,255,0) 100%);
}

.banner-matn{
  position:relative; z-index:3;
  padding:38px 28px;
  max-width:560px;
}

.banner-belgi{
  display:inline-block;
  font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase;
  padding:5px 11px; border-radius:4px;
  background:var(--navy); color:var(--white);
  margin-bottom:14px;
}

.banner h2{
  font-family:var(--serif);
  font-size:clamp(23px, 3.6vw, 36px);
  line-height:1.22; font-weight:700;
  color:var(--navy); margin:0 0 14px;
}

.banner p{
  margin:0 0 22px;
  color:var(--ink-soft); font-size:16px;
  max-width:46ch;
}

.banner-tugma{
  display:inline-block;
  background:var(--navy); color:var(--white);
  text-decoration:none;
  font-size:17px; font-weight:700; letter-spacing:.02em;
  padding:14px 30px; border-radius:8px;
}
.banner-tugma:hover{ background:var(--blue); }
.banner-tugma.kutilmoqda{ background:var(--blue); }

/* Bannerni almashtirish nuqtalari */
.banner-nuqta{
  display:flex; gap:8px; justify-content:center;
  margin-top:14px;
}
.banner-nuqta button{
  width:9px; height:9px; border-radius:50%;
  border:0; padding:0; cursor:pointer;
  background:var(--line);
}
.banner-nuqta button.faol{ background:var(--navy); width:24px; border-radius:6px; }

@media (max-width:760px){
  .banner{ flex-direction:column; align-items:stretch; min-height:0; }
  .banner-rasm{ position:relative; height:190px; }
  .banner-parda{ display:none; }
  .banner-matn{ padding:24px 20px; max-width:none; background:var(--white); }
}

/* ---------- HERO ---------- */

.hero{
  background:var(--white);
  border-bottom:1px solid var(--line);
  padding:52px 0 44px;
}
.hero h1{
  font-family:var(--serif);
  font-size:clamp(28px, 5.4vw, 44px);
  line-height:1.2; font-weight:600;
  margin:0 0 18px; max-width:17ch;
  color:var(--navy);
}
.hero p{ margin:0; max-width:56ch; color:var(--ink-soft); font-size:17px; }

/* ---------- RAQAMLAR (logotip fonida) ---------- */

.raqam-bolim{
  position:relative;
  background:var(--navy);
  color:var(--white);
  overflow:hidden;
  padding:46px 0;
}

/* Logotip fon sifatida — xira va katta */
.raqam-fon{
  position:absolute;
  right:-40px; top:50%;
  transform:translateY(-50%);
  width:320px; opacity:.07;
  pointer-events:none;
  z-index:1;
}

.raqam-bolim .ichki{ position:relative; z-index:2; }

.raqam-tur{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:18px;
}
@media (max-width:620px){
  .raqam-tur{ grid-template-columns:1fr; gap:14px; }
  .raqam-fon{ width:220px; opacity:.05; }
}

.raqam-katak{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:22px 20px;
}
.raqam-katak strong{
  display:block;
  font-family:var(--serif);
  font-size:38px; font-weight:700;
  color:var(--white); line-height:1.1;
  margin-bottom:6px;
}
.raqam-katak span{ font-size:14px; color:rgba(255,255,255,.74); }

/* ---------- BO'LIM SARLAVHASI ---------- */

.bolim{ padding:46px 0; }

.bolim-bosh{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:16px; margin-bottom:6px;
}
.bolim-bosh h2{
  font-family:var(--serif); font-size:26px; font-weight:700;
  margin:0; color:var(--navy);
}
.bolim-bosh a{ font-size:15px; color:var(--blue); text-decoration:none; white-space:nowrap; }
.bolim-bosh a:hover{ text-decoration:underline; }

.bolim-izoh{ color:var(--ink-soft); font-size:15px; margin:0 0 22px; }

/* ---------- KARUSEL ---------- */

.lenta-oram{ position:relative; }

.lenta{
  display:flex; gap:18px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  padding-bottom:10px;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.lenta::-webkit-scrollbar{ display:none; }

.lenta > *{
  flex:0 0 auto;
  width:168px;
  scroll-snap-align:start;
}
@media (min-width:620px){ .lenta > *{ width:196px; } }

.lenta-tugma{
  display:none;
  position:absolute; top:34%;
  width:42px; height:42px; border-radius:50%;
  background:var(--white); border:1px solid var(--line);
  color:var(--navy); font-size:19px; cursor:pointer;
  align-items:center; justify-content:center;
  box-shadow:0 2px 10px rgba(0,11,92,.14);
  z-index:5;
}
.lenta-tugma:hover{ background:var(--blue-soft); }
.lenta-tugma.chap{ left:-19px; }
.lenta-tugma.ong{ right:-19px; }

@media (min-width:1180px){ .lenta-tugma{ display:flex; } }

/* ---------- KITOB KARTASI ----------
   Kartalar bir xil balandlikda: tugma doim pastda turadi. */

.tur{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:26px 16px;
}
@media (min-width:620px){ .tur{ grid-template-columns:repeat(3,1fr); gap:30px 20px; } }
@media (min-width:900px){ .tur{ grid-template-columns:repeat(4,1fr); } }

.kitob-oram{
  display:flex; flex-direction:column;
  height:100%;
}

.kitob{ text-decoration:none; color:inherit; display:flex; flex-direction:column; flex:1; }

.muqova{
  aspect-ratio:2/3;
  background:var(--blue-soft);
  border-radius:6px;
  overflow:hidden;
  position:relative;
  box-shadow:0 2px 8px rgba(0,11,92,.13);
}
.muqova img{ width:100%; height:100%; object-fit:cover; position:relative; z-index:2; }

/* Rasm bo'lmaganda ko'rinadi. z-index:1 — rasm ostida qoladi. */
.muqova-bosh{
  position:absolute; inset:0; z-index:1;
  display:flex; align-items:center; justify-content:center;
  padding:14px; text-align:center;
  font-family:var(--serif); font-size:14px; line-height:1.35;
  color:var(--navy);
}

.kitob h3{
  font-family:var(--serif); font-size:16px; font-weight:600;
  margin:12px 0 3px; line-height:1.3;
}
.kitob .muallif{ font-size:13px; color:var(--ink-soft); margin:0; }

/* Narx tugmadan oldin, bo'sh joyni egallaydi */
.kitob .narx{
  font-size:16px; margin:8px 0 0;
  font-weight:700; color:var(--navy);
  margin-top:auto; padding-top:8px;
}

.karta-tugma{
  display:block; width:100%;
  margin-top:10px; padding:11px 10px;
  border:1px solid var(--navy); border-radius:7px;
  background:var(--navy); color:var(--white);
  font-family:var(--sans); font-size:14px; font-weight:600;
  text-align:center; text-decoration:none; cursor:pointer;
}
.karta-tugma:hover{ background:var(--blue); border-color:var(--blue); }

.karta-tugma.ikkilamchi{
  background:var(--white); color:var(--navy);
  border-color:var(--line);
}
.karta-tugma.ikkilamchi:hover{ background:var(--blue-soft); border-color:var(--blue); }

.nishon{
  display:inline-block;
  font-size:11px; font-weight:600; letter-spacing:.02em;
  padding:3px 8px; border-radius:4px;
  background:var(--blue); color:var(--white);
  position:absolute; top:8px; left:8px; z-index:3;
}
.nishon.kul{ background:var(--ink-soft); }

/* ---------- KATALOG FILTRLARI ---------- */

.filtr{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:24px; }
.filtr input, .filtr select{
  font-family:var(--sans); font-size:15px;
  padding:11px 12px;
  border:1px solid var(--line); border-radius:6px;
  background:var(--white); color:var(--ink);
  min-width:0;
}
.filtr input{ flex:1 1 200px; }
.filtr select{ flex:0 1 auto; }

.natija-soni{ font-size:14px; color:var(--ink-soft); margin:0 0 18px; }

/* ---------- KITOB SAHIFASI ---------- */

.kitob-sahifa{ display:grid; gap:28px; }
@media (min-width:760px){
  .kitob-sahifa{ grid-template-columns:300px 1fr; gap:46px; align-items:start; }
}
.kitob-sahifa h1{
  font-family:var(--serif); font-size:clamp(24px,4.5vw,33px);
  font-weight:600; margin:0 0 6px; color:var(--navy); line-height:1.25;
}
.kitob-sahifa .muallif-katta{ font-size:17px; color:var(--ink-soft); margin:0 0 22px; }

.narx-katta{
  font-family:var(--serif); font-size:29px; font-weight:700;
  color:var(--navy); margin:0 0 18px;
}

.sotib-blok{
  background:var(--white); border:1px solid var(--line);
  border-radius:9px; padding:18px; margin-bottom:24px;
}
.sotib-qator{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

.soni-boshqaruv{
  display:flex; align-items:center;
  border:1px solid var(--line); border-radius:6px;
  background:var(--white); overflow:hidden;
}
.soni-boshqaruv button{
  width:38px; height:42px; border:0; background:none;
  font-size:19px; color:var(--navy); cursor:pointer; font-family:var(--sans);
}
.soni-boshqaruv button:hover{ background:var(--blue-soft); }
.soni-boshqaruv span{ min-width:42px; text-align:center; font-size:16px; font-weight:600; }

.katta-tugma{
  flex:1 1 180px;
  padding:13px 22px; border:0; border-radius:7px;
  background:var(--navy); color:var(--white);
  font-family:var(--sans); font-size:15px; font-weight:600;
  cursor:pointer; text-align:center; text-decoration:none;
  display:inline-block;
}
.katta-tugma:hover{ background:var(--blue); }
.katta-tugma:disabled{ background:#9aa0b0; cursor:not-allowed; }

.tafsilot{ width:100%; border-collapse:collapse; margin:24px 0; font-size:15px; }
.tafsilot th, .tafsilot td{
  text-align:left; padding:9px 0;
  border-bottom:1px solid var(--line); vertical-align:top;
}
.tafsilot th{ font-weight:500; color:var(--ink-soft); width:42%; }

.tavsif-matn{ font-size:16px; line-height:1.72; max-width:68ch; }
.tavsif-matn p{ margin:0 0 14px; }

.orqaga{
  display:inline-block; margin-bottom:20px;
  font-size:15px; color:var(--blue); text-decoration:none;
}
.orqaga:hover{ text-decoration:underline; }

/* ---------- MATNLI SAHIFALAR ---------- */

.matn{ max-width:68ch; }
.matn h1{
  font-family:var(--serif); font-size:clamp(26px,5vw,35px);
  font-weight:600; color:var(--navy); margin:0 0 22px;
}
.matn h2{
  font-family:var(--serif); font-size:21px; font-weight:600;
  color:var(--navy); margin:34px 0 12px;
}
.matn p{ margin:0 0 16px; line-height:1.72; }

/* ---------- JAMOA ---------- */

.jamoa-tur{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:22px 16px;
}
@media (min-width:620px){ .jamoa-tur{ grid-template-columns:repeat(3,1fr); } }
@media (min-width:900px){ .jamoa-tur{ grid-template-columns:repeat(4,1fr); } }

.xodim{ text-align:center; }

.xodim-rasm{
  width:108px; height:108px;
  border-radius:50%;
  margin:0 auto 12px;
  background:var(--blue-soft);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  border:3px solid var(--white);
  box-shadow:0 2px 10px rgba(0,11,92,.12);
}
.xodim-rasm img{ width:100%; height:100%; object-fit:cover; }
.xodim-rasm svg{ width:52px; height:52px; }

.xodim strong{
  display:block; font-size:15px; font-weight:600;
  color:var(--ink); line-height:1.35; margin-bottom:3px;
}
.xodim span{ font-size:13px; color:var(--ink-soft); }

/* ---------- ALOQA RO'YXATI ---------- */

.aloqa-royxat{ list-style:none; padding:0; margin:0; }
.aloqa-royxat li{ padding:14px 0; border-bottom:1px solid var(--line); }
.aloqa-royxat small{ display:block; color:var(--ink-soft); font-size:13px; margin-bottom:3px; }
.aloqa-royxat a{ color:var(--blue); text-decoration:none; font-size:17px; }
.aloqa-royxat a:hover{ text-decoration:underline; }

/* ---------- SAVAT ---------- */

.savat-parda{
  position:fixed; inset:0; z-index:100;
  background:rgba(10,14,40,.5);
  display:flex; justify-content:flex-end;
}

.savat-oyna{
  background:var(--paper);
  width:100%; max-width:440px;
  display:flex; flex-direction:column;
  height:100%;
}

.savat-bosh{
  background:var(--white);
  padding:16px 20px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
}
.savat-bosh h2{ font-family:var(--serif); font-size:20px; margin:0; color:var(--navy); }
.savat-bosh button{
  background:none; border:0; font-size:27px; line-height:1;
  color:var(--ink-soft); cursor:pointer; padding:0 4px;
}

.savat-tana{ flex:1; overflow-y:auto; padding:16px 20px; }

.savat-qator{
  display:flex; gap:13px;
  background:var(--white); border:1px solid var(--line);
  border-radius:8px; padding:12px; margin-bottom:11px;
}
.savat-qator img{
  width:52px; height:74px; object-fit:cover;
  border-radius:4px; background:var(--blue-soft); flex-shrink:0;
}
.savat-qator .ong{ flex:1; min-width:0; }
.savat-qator h4{
  font-family:var(--serif); font-size:15px; font-weight:600;
  margin:0 0 3px; line-height:1.3;
}
.savat-qator .narx-kichik{ font-size:13px; color:var(--ink-soft); margin:0 0 9px; }

.savat-qator .boshqaruv{ display:flex; align-items:center; gap:10px; }
.savat-qator .boshqaruv button{
  width:28px; height:28px; border:1px solid var(--line);
  border-radius:5px; background:var(--white);
  font-size:15px; color:var(--navy); cursor:pointer; line-height:1;
}
.savat-qator .boshqaruv button:hover{ background:var(--blue-soft); }
.savat-qator .boshqaruv span{ font-size:14px; font-weight:600; min-width:22px; text-align:center; }

.savat-ochir{
  background:none !important; border:0 !important;
  color:var(--ink-soft) !important;
  font-size:13px; cursor:pointer; margin-left:auto;
  text-decoration:underline; font-family:var(--sans);
  width:auto !important; height:auto !important;
}
.savat-ochir:hover{ color:#a32020 !important; }

.savat-past{
  background:var(--white); border-top:1px solid var(--line);
  padding:16px 20px;
}
.savat-jami{
  display:flex; justify-content:space-between; align-items:baseline;
  margin-bottom:13px;
}
.savat-jami span{ color:var(--ink-soft); font-size:15px; }
.savat-jami strong{ font-family:var(--serif); font-size:22px; color:var(--navy); }

.savat-bosh-matn{ text-align:center; padding:50px 20px; color:var(--ink-soft); }

/* ---------- BUYURTMA FORMASI ---------- */

.forma{ max-width:560px; }

.forma-maydon{ margin-bottom:17px; }
.forma-maydon label{
  display:block; font-size:14px; font-weight:600;
  margin-bottom:6px; color:var(--ink);
}
.forma-maydon input, .forma-maydon textarea, .forma-maydon select{
  width:100%; padding:12px;
  border:1px solid var(--line); border-radius:6px;
  font-family:var(--sans); font-size:16px;
  background:var(--white); color:var(--ink);
}
.forma-maydon textarea{ resize:vertical; min-height:80px; }

<script>
/* ============================================================
   FACTOR BOOKS — sayt mantiqiy qismi
   ============================================================ */

/* ---------- SOZLAMALAR ----------
   Faqat shu blokni o'zgartirasiz.
   Aloqa ma'lumotlari bu yerda EMAS — ular Google Sheets'dagi
   "Sozlama" varag'idan olinadi va admin paneldan tahrirlanadi. */

var SOZLAMA = {
  api: "https://script.google.com/macros/s/AKfycbzqzes3O_B1kjZmBjG0aW-UeEtwTKiDh5z5g3JcOFCt-H7pyJI_fbsBh3ENjk2WOzKe/exec",

  muqovaPapka: "rasmlar/muqovalar/",
  elonPapka:   "rasmlar/elonlar/",
  jamoaPapka:  "rasmlar/jamoa/",
  logo:        "rasmlar/logo.png",

  karuselSoni: 8,   // karuseldagi kitoblar soni
  bannerSoni:  4    // bannerda aylanadigan e'lonlar soni
};

/* ---------- IKONKALAR ---------- */

var IKON_ERKAK = '<svg viewBox="0 0 24 24" fill="none" stroke="#40507f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/></svg>';
var IKON_AYOL   = '<svg viewBox="0 0 24 24" fill="none" stroke="#7a4a7a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 2.5-7 7-7s7 3 7 7"/><path d="M7 9c0-3 2-6 5-6s5 3 5 6"/></svg>';

var IKON_TELEGRAM = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M21.9 4.3L18.9 19c-.2 1-.8 1.2-1.6.8l-4.5-3.3-2.2 2.1c-.2.2-.5.5-.9.5l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L7.4 13l-4.5-1.4c-1-.3-1-1 .2-1.4l17.5-6.8c.8-.3 1.5.2 1.3 1z"/></svg>';
var IKON_INSTAGRAM = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg>';
var IKON_FACEBOOK = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M14 9V7c0-.9.3-1.4 1.5-1.4H17V3h-2.5C11.9 3 11 4.4 11 6.6V9H9v3h2v9h3v-9h2.3l.4-3H14z"/></svg>';

/* ---------- MA'LUMOT ---------- */

var BAZA = { kitoblar:null, sozlama:{}, elonlar:[], jamoa:[], xato:null };

function malumotniYukla(){
  if(BAZA.kitoblar){ return Promise.resolve(BAZA); }

  return fetch(SOZLAMA.api + "?nima=hammasi")
    .then(function(j){
      if(!j.ok){ throw new Error("Server javob bermadi (" + j.status + ")"); }
      return j.json();
    })
    .then(function(d){
      if(!d.ok){ throw new Error(d.xato || "Noma'lum xato"); }
      BAZA.kitoblar = d.kitoblar || [];
      BAZA.sozlama  = d.sozlama  || {};
      BAZA.elonlar  = d.elonlar  || [];
      BAZA.jamoa    = d.jamoa    || [];
      futerniChiz();
      return BAZA;
    })
    .catch(function(e){
      BAZA.xato = e.message;
      throw e;
    });
}

function soz(kalit, zaxira){
  var q = BAZA.sozlama[kalit];
  return (q === undefined || q === null || q === "") ? (zaxira || "") : q;
}

/* ---------- YORDAMCHI ---------- */

function xavfsiz(matn){
  return String(matn == null ? "" : matn)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function sonAjrat(son){
  return String(son).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function narxYoz(son){
  var n = parseInt(String(son).replace(/\D/g,""), 10);
  if(!n || isNaN(n)){ return ""; }
  return sonAjrat(n) + " so'm";
}

function narxSoni(qiymat){
  return parseInt(String(qiymat).replace(/\D/g,""), 10) || 0;
}

function bosh(matn){
  var s = String(matn || "");
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
}

function matnniBol(matn){
  if(!matn){ return ""; }
  return String(matn).split(/\n+/).filter(function(p){ return p.trim(); })
    .map(function(p){ return '<p>' + xavfsiz(p.trim()) + '</p>'; }).join("");
}

function kitobTop(id){
  if(!BAZA.kitoblar){ return null; }
  for(var i=0;i<BAZA.kitoblar.length;i++){
    if(BAZA.kitoblar[i].id === id){ return BAZA.kitoblar[i]; }
  }
  return null;
}

function bildirish(matn){
  var eski = document.querySelector(".bildirish");
  if(eski){ eski.remove(); }

  var blok = document.createElement("div");
  blok.className = "bildirish";
  blok.textContent = matn;
  document.body.appendChild(blok);

  setTimeout(function(){ blok.remove(); }, 2600);
}

/* ---------- SAVAT ----------
   Brauzer xotirasida. Faqat id va soni saqlanadi;
   narx har safar bazadan olinadi. */

var SAVAT_KALIT = "mfb_savat";

function savatniOl(){
  try{
    var xom = localStorage.getItem(SAVAT_KALIT);
    var royxat = xom ? JSON.parse(xom) : [];
    return Array.isArray(royxat) ? royxat : [];
  }catch(e){ return []; }
}

function savatniSaqla(royxat){
  try{ localStorage.setItem(SAVAT_KALIT, JSON.stringify(royxat)); }catch(e){}
  savatSoniniYangila();
}

function savatgaQosh(kitobId, soni){
  var royxat = savatniOl();
  var topildi = false;

  for(var i=0;i<royxat.length;i++){
    if(royxat[i].id === kitobId){
      royxat[i].soni += soni;
      topildi = true;
      break;
    }
  }

  if(!topildi){ royxat.push({ id:kitobId, soni:soni }); }

  savatniSaqla(royxat);
}

function savatSoniniOzgartir(kitobId, farq){
  var royxat = savatniOl();

  for(var i=0;i<royxat.length;i++){
    if(royxat[i].id === kitobId){
      royxat[i].soni += farq;
      if(royxat[i].soni < 1){ royxat.splice(i,1); }
      break;
    }
  }

  savatniSaqla(royxat);
}

function savatdanOchir(kitobId){
  savatniSaqla(savatniOl().filter(function(x){ return x.id !== kitobId; }));
}

function savatniTozala(){ savatniSaqla([]); }

function savatJamiSoni(){
  var jami = 0;
  var royxat = savatniOl();
  for(var i=0;i<royxat.length;i++){ jami += royxat[i].soni; }
  return jami;
}

function savatSummasi(){
  var jami = 0;
  var royxat = savatniOl();

  for(var i=0;i<royxat.length;i++){
    var k = kitobTop(royxat[i].id);
    if(!k){ continue; }
    jami += narxSoni(k.narx_chakana) * royxat[i].soni;
  }

  return jami;
}

function savatSoniniYangila(){
  var soni = savatJamiSoni();
  var belgi = document.getElementById("savatSoni");
  if(!belgi){ return; }
  belgi.textContent = soni;
  belgi.style.display = soni > 0 ? "flex" : "none";
}

/* ---------- KITOB KARTASI ---------- */

function kartaHtml(k){
  var nishon = "";
  if(k.holat === "tez kunda"){ nishon = '<span class="nishon">Tez kunda</span>'; }
  if(k.holat === "tugagan"){   nishon = '<span class="nishon kul">Tugagan</span>'; }

  var sotuvdami = (k.holat === "sotuvda");

  var rasm = "";
  if(k.rasm){
    rasm = '<img src="' + SOZLAMA.muqovaPapka + xavfsiz(k.rasm) + '" alt="'
         + xavfsiz(k.nomi) + '" loading="lazy" onerror="this.remove()">';
  }

  var narxHtml = '<p class="narx" style="color:var(--ink-soft);font-weight:500">Sotuvda yo\'q</p>';
  if(sotuvdami){
    narxHtml = '<p class="narx">' + narxYoz(k.narx_chakana) + '</p>';
  } else if(k.holat === "tez kunda"){
    narxHtml = '<p class="narx" style="color:var(--blue);font-weight:600">Tez kunda</p>';
  }

  var tugma = '<a class="karta-tugma ikkilamchi" href="#/kitob/' + xavfsiz(k.id) + '">Batafsil</a>';
  if(sotuvdami){
    tugma = '<button class="karta-tugma" data-savat="' + xavfsiz(k.id) + '">Savatga qo\'shish</button>';
  }

  return ''
  + '<div class="kitob-oram">'
  +   '<a class="kitob" href="#/kitob/' + xavfsiz(k.id) + '">'
  +     '<div class="muqova">'
  +       '<div class="muqova-bosh">' + xavfsiz(k.nomi) + '</div>'
  +       rasm
  +       nishon
  +     '</div>'
  +     '<h3>' + xavfsiz(k.nomi) + '</h3>'
  +     '<p class="muallif">' + xavfsiz(k.muallif) + '</p>'
  +     narxHtml
  +   '</a>'
  +   tugma
  + '</div>';
}

/* ============================================================
   SAHIFALAR
   ============================================================ */

/* ---------- BANNER ----------
   Tugma kitobga bog'lanishga qarab hal qilinadi:
     kitob sotuvda  -> "Sotuvda!"   -> do'konga
     kitob tez kunda -> "Tez kunda" -> kitob sahifasiga
     kitob yo'q      -> "Batafsil"  -> kitob sahifasiga yoki yo'q */

function bannerHtml(e){
  var rasm = "";
  if(e.rasm){
    rasm = '<img class="banner-rasm" src="' + SOZLAMA.elonPapka + xavfsiz(e.rasm)
         + '" alt="" onerror="this.remove()">';
  }

  var turNomi = String(e.turi || "").replace(/_/g," ");
  var belgi = "";
  if(turNomi){ belgi = '<span class="banner-belgi">' + xavfsiz(turNomi) + '</span>'; }

  // Matnni qisqartiramiz — banner uzun matnga mo'ljallanmagan
  var matn = String(e.matn || "");
  if(matn.length > 200){ matn = matn.substring(0,200).trim() + "…"; }

  var matnHtml = "";
  if(matn){ matnHtml = '<p>' + xavfsiz(matn) + '</p>'; }

  // Tugma
  var tugma = "";
  var k = e.kitob_id ? kitobTop(e.kitob_id) : null;

  if(k){
    var holat = String(k.holat || "").toLowerCase();

    if(holat === "sotuvda"){
      tugma = '<a class="banner-tugma" href="#/dokon">SOTUVDA!</a>';
    } else if(holat === "tez kunda"){
      tugma = '<a class="banner-tugma kutilmoqda" href="#/kitob/'
            + xavfsiz(k.id) + '">TEZ KUNDA</a>';
    } else {
      tugma = '<a class="banner-tugma" href="#/kitob/' + xavfsiz(k.id) + '">Batafsil</a>';
    }
  }

  return ''
  + '<div class="banner">'
  +   rasm
  +   '<div class="banner-parda"></div>'
  +   '<div class="banner-matn">'
  +     belgi
  +     '<h2>' + xavfsiz(e.sarlavha) + '</h2>'
  +     matnHtml
  +     tugma
  +   '</div>'
  + '</div>';
}

/* ---------- 1. BOSH SAHIFA ---------- */

function sahifaBosh(){
  var kitoblar = BAZA.kitoblar;

  // Eng yangi kitoblar
  var yangi = kitoblar.slice().sort(function(a,b){
    return (parseInt(b.yil,10)||0) - (parseInt(a.yil,10)||0);
  }).slice(0, SOZLAMA.karuselSoni);

  var elonlar = BAZA.elonlar.slice(0, SOZLAMA.bannerSoni);

  var html = "";

  // Banner — eng tepada
  if(elonlar.length > 0){
    var nuqtalar = "";
    if(elonlar.length > 1){
      nuqtalar = '<div class="banner-nuqta" id="bannerNuqta">'
        + elonlar.map(function(e, n){
            return '<button data-banner="' + n + '" aria-label="' + (n+1) + '"></button>';
          }).join("")
        + '</div>';
    }

    html += ''
    + '<section class="banner-bolim"><div class="ichki">'
    +   '<div id="bannerOram">' + bannerHtml(elonlar[0]) + '</div>'
    +   nuqtalar
    + '</div></section>';
  }

  // So'nggi nashrlar — karusel
  html += ''
  + '<section class="bolim"><div class="ichki">'
  +   '<div class="bolim-bosh">'
  +     '<h2>So\'nggi nashrlar</h2>'
  +     '<a href="#/dokon">Barchasi →</a>'
  +   '</div>'
  +   '<p class="bolim-izoh">Yaqinda nashrdan chiqqan kitoblarimiz</p>'
  +   '<div class="lenta-oram">'
  +     '<button class="lenta-tugma chap" id="lentaChap" aria-label="Orqaga">‹</button>'
  +     '<div class="lenta" id="lenta">' + yangi.map(kartaHtml).join("") + '</div>'
  +     '<button class="lenta-tugma ong" id="lentaOng" aria-label="Oldinga">›</button>'
  +   '</div>'
  + '</div></section>';

  // Nashriyot haqida — hero
  html += ''
  + '<section class="hero"><div class="ichki">'
  +   '<h1>Jahon adabiyoti, asl nusxadan tarjima qilingan</h1>'
  +   '<p>Factor books — 2021-yildan beri faoliyat yuritayotgan mustaqil nashriyot. '
  +   'Kitoblarni ingliz, turk, rus va arab tillaridan bevosita o\'zbek tiliga o\'giramiz, '
  +   'oraliq tilsiz. Muallif huquqlari rasmiy shartnoma asosida sotib olinadi.</p>'
  + '</div></section>';

  // Raqamlar — logotip fonida
  html += ''
  + '<section class="raqam-bolim">'
  +   '<img class="raqam-fon" src="' + SOZLAMA.logo + '" alt="" onerror="this.remove()">'
  +   '<div class="ichki">'
  +     '<div class="raqam-tur">'
  +       '<div class="raqam-katak"><strong>40+</strong><span>nashr etilgan kitob</span></div>'
  +       '<div class="raqam-katak"><strong>4</strong><span>tarjima tili</span></div>'
  +       '<div class="raqam-katak"><strong>2021</strong><span>tashkil topgan yil</span></div>'
  +     '</div>'
  +   '</div>'
  + '</section>';

  // Jamoa
  if(BAZA.jamoa.length > 0){
    html += ''
    + '<section class="bolim"><div class="ichki">'
    +   '<div class="bolim-bosh"><h2>Jamoa</h2></div>'
    +   '<p class="bolim-izoh">Kitoblarimiz ustida ishlaydigan odamlar</p>'
    +   '<div class="jamoa-tur">' + BAZA.jamoa.map(xodimHtml).join("") + '</div>'
    + '</div></section>';
  }

  return html;
}

/**
 * Bannerni almashtirish.
 */
function bannerniIshlat(){
  var nuqta = document.getElementById("bannerNuqta");
  if(!nuqta){ return; }

  var elonlar = BAZA.elonlar.slice(0, SOZLAMA.bannerSoni);
  var oram = document.getElementById("bannerOram");
  var tugmalar = nuqta.querySelectorAll("button");

  function korsat(n){
    oram.innerHTML = bannerHtml(elonlar[n]);
    for(var i=0;i<tugmalar.length;i++){
      tugmalar[i].classList.toggle("faol", i === n);
    }
  }

  for(var i=0;i<tugmalar.length;i++){
    (function(n){
      tugmalar[n].addEventListener("click", function(){ korsat(n); });
    })(i);
  }

  korsat(0);
}

function lentaniIshlat(){
  var lenta = document.getElementById("lenta");
  if(!lenta){ return; }

  var chap = document.getElementById("lentaChap");

/* ---------- 2. DO'KON ---------- */

function sahifaDokon(){
  var kitoblar = BAZA.kitoblar;

  var janrlar = [], tillar = [];
  for(var i=0;i<kitoblar.length;i++){
    var k = kitoblar[i];
    if(k.janr    && janrlar.indexOf(k.janr) === -1){ janrlar.push(k.janr); }
    if(k.til_asl && tillar.indexOf(k.til_asl) === -1){ tillar.push(k.til_asl); }
  }
  janrlar.sort(); tillar.sort();

  var janrTanlov = janrlar.map(function(j){
    return '<option value="' + xavfsiz(j) + '">' + xavfsiz(bosh(j)) + '</option>';
  }).join("");

  var tilTanlov = tillar.map(function(t){
    return '<option value="' + xavfsiz(t) + '">' + xavfsiz(bosh(t)) + ' tilidan</option>';
  }).join("");

  return ''
  + '<section class="bolim"><div class="ichki">'
  +   '<div class="bolim-bosh"><h2>Do\'kon</h2></div>'
  +   '<p class="bolim-izoh">Barcha kitoblarimiz</p>'
  +   '<div class="filtr">'
  +     '<input type="search" id="qidiruv" placeholder="Kitob yoki muallif nomi" aria-label="Qidiruv">'
  +     '<select id="fJanr" aria-label="Janr"><option value="">Barcha janrlar</option>'
  +        janrTanlov
  +     '</select>'
  +     '<select id="fTil" aria-label="Til"><option value="">Barcha tillar</option>'
  +        tilTanlov
  +     '</select>'
  +   '</div>'
  +   '<p class="natija-soni" id="natijaSoni"></p>'
  +   '<div class="tur" id="katalogTur"></div>'
  + '</div></section>';
}

function dokonniIshlat(){
  var kitoblar = BAZA.kitoblar;

  var qidiruv = document.getElementById("qidiruv");
  var fJanr   = document.getElementById("fJanr");
  var fTil    = document.getElementById("fTil");
  var tur     = document.getElementById("katalogTur");
  var soni    = document.getElementById("natijaSoni");
  if(!tur){ return; }

  function chiz(){
    var q = (qidiruv.value || "").toLowerCase().trim();
    var j = fJanr.value;
    var t = fTil.value;

    var royxat = kitoblar.filter(function(k){
      if(j && k.janr !== j){ return false; }
      if(t && k.til_asl !== t){ return false; }
      if(q){
        var matn = (k.nomi + " " + k.muallif + " " + k.tarjimon).toLowerCase();
        if(matn.indexOf(q) === -1){ return false; }
      }
      return true;
    });

    if(royxat.length === 0){
      tur.innerHTML = '';
      soni.textContent = 'Bu shartlarga mos kitob topilmadi.';
      return;
    }

    soni.textContent = royxat.length + " ta kitob";
    tur.innerHTML = royxat.map(kartaHtml).join("");
  }

  qidiruv.addEventListener("input", chiz);
  fJanr.addEventListener("change", chiz);
  fTil.addEventListener("change", chiz);
  chiz();
}

function buyurtmaniIshlat(){
  var tugma = document.getElementById("buyurtmaYubor");
  if(!tugma){ return; }

  tugma.addEventListener("click", function(){
    var xatoBlok = document.getElementById("formaXato");
    xatoBlok.style.display = "none";

    var ism = document.getElementById("bIsm").value.trim();
    if(ism.length < 2){
      xatoniKorsat(xatoBlok, "Ismingizni kiriting.");
      return;
    }

    var telefon = document.getElementById("bTelefon").value.trim();
    var faqatRaqam = telefon.replace(/\D/g,"");
    if(faqatRaqam.length !== 9 && faqatRaqam.length !== 12){
      xatoniKorsat(xatoBlok, "Telefon raqamini to'g'ri kiriting. Masalan: 90 123 45 67");
      return;
    }

    var tolovTugma = document.querySelector('input[name="tolov"]:checked');

    var savatQatorlari = savatniOl().map(function(x){
      return { kitob_id: x.id, soni: x.soni };
    });

    var malumot = {
      amal: "buyurtma",
      ism: ism,
      telefon: telefon,
      manzil: document.getElementById("bManzil").value.trim(),
      promokod: document.getElementById("bPromokod").value.trim(),
      tolov_turi: tolovTugma ? tolovTugma.value : "naqd",
      izoh: document.getElementById("bIzoh").value.trim(),
      qatorlar: savatQatorlari
    };

    tugma.disabled = true;
    tugma.textContent = "Yuborilmoqda...";

    // Apps Script preflight so'rovga javob bermaydi,
    // shuning uchun Content-Type ataylab "text/plain"
    fetch(SOZLAMA.api, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(malumot)
    })
    .then(function(j){ return j.json(); })
    .then(function(natija){
      tugma.disabled = false;
      tugma.textContent = "Buyurtmani yuborish";

      if(!natija.ok){
        xatoniKorsat(xatoBlok, natija.xato || "Buyurtma yuborilmadi.");
        return;
      }

      savatniTozala();
      OXIRGI_BUYURTMA = natija;
      location.hash = "#/rahmat";
    })
    .catch(function(e){
      tugma.disabled = false;
      tugma.textContent = "Buyurtmani yuborish";
      xatoniKorsat(xatoBlok, "Ulanishda xato: " + e.message);
    });
  });
}

function xatoniKorsat(blok, matn){
  blok.textContent = matn;
  blok.style.display = "block";
  blok.scrollIntoView({ behavior:"smooth", block:"center" });
}

      + '</div>');
    }

    ichi = qatorlar.join("");
  }

  var pastBlok = "";
  if(savat.length > 0){
    pastBlok = ''
    + '<div class="savat-past">'
    +   '<div class="savat-jami"><span>Jami</span><strong>'
    +     sonAjrat(savatSummasi()) + ' so\'m</strong></div>'
    +   '<button class="katta-tugma" id="buyurtmagaOtish" style="width:100%">Buyurtma berish</button>'
    + '</div>';
  }

  var parda = document.createElement("div");
  parda.className = "savat-parda";

  parda.innerHTML = ''
  + '<div class="savat-oyna">'
  +   '<div class="savat-bosh">'
  +     '<h2>Savat</h2>'
  +     '<button id="savatYopish" aria-label="Yopish">&times;</button>'
  +   '</div>'
  +   '<div class="savat-tana">' + ichi + '</div>'
  +   pastBlok
  + '</div>';

  document.body.appendChild(parda);
  document.body.style.overflow = "hidden";

  function yop(){
    parda.remove();
    document.body.style.overflow = "";
  }

  document.getElementById("savatYopish").addEventListener("click", yop);
  parda.addEventListener("click", function(h){ if(h.target === parda){ yop(); } });

  parda.addEventListener("click", function(h){
    if(!h.target.getAttribute){ return; }

    var kam   = h.target.getAttribute("data-kam");
    var kop   = h.target.getAttribute("data-kop");
    var ochir = h.target.getAttribute("data-ochir");

    if(kam){   savatSoniniOzgartir(kam, -1); yop(); savatniOch(); }
    if(kop){   savatSoniniOzgartir(kop, 1);  yop(); savatniOch(); }
    if(ochir){ savatdanOchir(ochir);         yop(); savatniOch(); }
  });

  var otish = document.getElementById("buyurtmagaOtish");
  if(otish){
    otish.addEventListener("click", function(){
      yop();
      location.hash = "#/buyurtma";
    });
  }
}

/* ============================================================
   PASTKI PANEL — Sozlama varag'idan
   ============================================================ */

function futerniChiz(){
  var royxat = document.getElementById("futerAloqa");
  var past = document.getElementById("futerPast");
  var ijtimoiy = document.getElementById("futerIjtimoiy");
  if(!royxat || !past){ return; }

  // Aloqa ustuni
  var qatorlar = [];

  var tel1 = soz("telefon_1");
  var tel2 = soz("telefon_2");
  var email = soz("email");
  var manzil = soz("manzil");
  var ishVaqti = soz("ish_vaqti");

  if(tel1){
    qatorlar.push('<li><a href="tel:' + tel1.replace(/\s/g,"") + '">'
      + xavfsiz(tel1) + '</a></li>');
  }
  if(tel2){
    qatorlar.push('<li><a href="tel:' + tel2.replace(/\s/g,"") + '">'
      + xavfsiz(tel2) + '</a></li>');
  }
  if(email){
    qatorlar.push('<li><a href="mailto:' + xavfsiz(email) + '">'
      + xavfsiz(email) + '</a></li>');
  }
  if(manzil){
    qatorlar.push('<li style="margin-top:12px">'
      + xavfsiz(manzil).replace(/\n/g,"<br>") + '</li>');
  }
  if(ishVaqti){
    qatorlar.push('<li>' + xavfsiz(ishVaqti) + '</li>');
  }

  royxat.innerHTML = qatorlar.join("");

  // Ijtimoiy tarmoq belgilari
  var belgilar = [];
  var telegram = soz("telegram");
  var instagram = soz("instagram");
  var facebook = soz("facebook");

  if(telegram){
    belgilar.push('<a href="' + xavfsiz(telegram) + '" target="_blank" rel="noopener" aria-label="Telegram">'
      + IKON_TELEGRAM + '</a>');
  }
  if(instagram){
    belgilar.push('<a href="' + xavfsiz(instagram) + '" target="_blank" rel="noopener" aria-label="Instagram">'
      + IKON_INSTAGRAM + '</a>');
  }
  if(facebook){
    belgilar.push('<a href="' + xavfsiz(facebook) + '" target="_blank" rel="noopener" aria-label="Facebook">'
      + IKON_FACEBOOK + '</a>');
  }

  if(ijtimoiy){ ijtimoiy.innerHTML = belgilar.join(""); }

  // Pastki qator
  var bolaklar = [];
  var yuridik = soz("yuridik_nomi");
  var stir = soz("stir");

  if(yuridik){ bolaklar.push(xavfsiz(yuridik)); }
  if(stir){ bolaklar.push("STIR: " + xavfsiz(stir)); }
  bolaklar.push("© " + new Date().getFullYear());

  past.innerHTML = bolaklar.join(" · ");
}

/* ============================================================
   YO'NALTIRUVCHI (ROUTER)
   ============================================================ */

var ekran = document.getElementById("ekran");

function yuklanmoqdaKorsat(){
  ekran.innerHTML = '<div class="holat"><strong>Yuklanmoqda</strong>Bir lahza kuting…</div>';
}

function xatoKorsat(xabar){
  ekran.innerHTML = '<div class="holat"><strong>Ma\'lumot yuklanmadi</strong>'
    + xavfsiz(xabar) + '<br><br>'
    + '<a href="javascript:location.reload()" style="color:var(--blue)">Qayta urinish</a></div>';
}

function yonaltir(){
  var yol = (location.hash || "#/").replace(/^#/, "");
  var qism = yol.split("/").filter(Boolean);

  var havolalar = document.querySelectorAll("#menyu a");
  for(var i=0;i<havolalar.length;i++){
    var h = havolalar[i].getAttribute("href").replace(/^#/,"");
    havolalar[i].classList.toggle("faol", h === yol);
  }

  document.getElementById("menyu").classList.remove("ochiq");
  document.getElementById("menyuTugma").setAttribute("aria-expanded","false");

  window.scrollTo(0,0);

  var bolim = qism[0] || "";

  yuklanmoqdaKorsat();

  malumotniYukla().then(function(){
    if(bolim === "dokon"){
      ekran.innerHTML = sahifaDokon();
      dokonniIshlat();
    } else if(bolim === "kitob"){
      ekran.innerHTML = sahifaKitob(qism[1] || "");
      kitobSahifasiniIshlat();
    } else if(bolim === "buyurtma"){
      ekran.innerHTML = sahifaBuyurtma();
      buyurtmaniIshlat();
    } else if(bolim === "rahmat"){
      ekran.innerHTML = sahifaRahmat();
    } else if(bolim === "aloqa"){
      ekran.innerHTML = sahifaAloqa();
    } else if(bolim === "ulgurji"){
      ekran.innerHTML = sahifaUlgurji();
    } else if(bolim === "haqida"){
      ekran.innerHTML = sahifaHaqida();
    } else {
      ekran.innerHTML = sahifaBosh();
      bannerniIshlat();
      lentaniIshlat();
    }

    savatSoniniYangila();
  }).catch(function(e){
    xatoKorsat(e.message);
  });
}

/* ============================================================
   ISHGA TUSHIRISH
   ============================================================ */

window.addEventListener("hashchange", yonaltir);

document.getElementById("menyuTugma").addEventListener("click", function(){
  var m = document.getElementById("menyu");
  var ochiq = m.classList.toggle("ochiq");
  this.setAttribute("aria-expanded", ochiq ? "true" : "false");
});

document.getElementById("savatTugma").addEventListener("click", savatniOch);

// "Savatga qo'shish" tugmalari — bitta joyda ushlaymiz
document.addEventListener("click", function(h){
  if(!h.target.getAttribute){ return; }

  var id = h.target.getAttribute("data-savat");
  if(!id){ return; }

  h.preventDefault();
  savatgaQosh(id, 1);
  bildirish("Savatga qo'shildi");
});

savatSoniniYangila();
yonaltir();
</script>
